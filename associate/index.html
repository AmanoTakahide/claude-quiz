<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>練習問題</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #2b2a28; --muted: #6b6760;
    --line: #e3ded6; --accent: #c4623f; --accent-weak: #f6e3db;
    --ok: #2f7d4f; --ok-bg: #e2f1e8; --ng: #b3392e; --ng-bg: #f9e1de; --warn: #a86b00; --okx: #bfe6cd; --ngx: #f6c4bf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1c1a; --card: #272624; --text: #ece8e1; --muted: #a39e94;
      --line: #3a3835; --accent: #e08462; --accent-weak: #3b2a24;
      --ok: #7cc79a; --ok-bg: #213529; --ng: #f08a80; --ng-bg: #3a2422; --warn: #e0b04a; --okx: #25573a; --ngx: #6a2c27;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif; line-height: 1.7; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 20px 0 8px; }
  .sub { color: var(--muted); font-size: .9rem; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
  .card h2:first-child { margin-top: 0; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; font-size: .8rem; }
  .tag { background: var(--accent-weak); color: var(--accent); padding: 2px 10px; border-radius: 999px; }
  .tag.plain { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .badge { font-size: .78rem; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  .badge.ng { color: var(--ng); border-color: var(--ng); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .qtext { font-size: 1.05rem; margin: 0 0 14px; white-space: pre-wrap; }
  .hint { color: var(--muted); font-size: .85rem; margin: -6px 0 12px; }
  label.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  label.opt:hover { border-color: var(--accent); }
  label.opt input { margin-top: 6px; }
  label.opt.correct { background: var(--ok-bg); border-color: var(--ok); }
  label.opt.wrong { background: var(--ng-bg); border-color: var(--ng); }
  label.opt.locked { cursor: default; }
  .mark { margin-left: auto; font-weight: 700; white-space: nowrap; padding-left: 8px; }
  .mark.ok { color: var(--ok); } .mark.ng { color: var(--ng); }
  .optrow { display: flex; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; margin-bottom: 6px; font-size: .95rem; }
  .optrow.correct { background: var(--ok-bg); border-color: var(--ok); }
  .optrow.wrong { background: var(--ng-bg); border-color: var(--ng); }
  button { font: inherit; border: 0; border-radius: 10px; padding: 10px 20px; cursor: pointer;
    background: var(--accent); color: #fff; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.small { padding: 4px 12px; font-size: .88rem; }
  /* 次の画面に進む、メインのボタン（回答する・次の問題へ・結果を見る） */
  button.primary { font-weight: 700; padding: 12px 28px; box-shadow: 0 2px 6px rgba(196, 98, 63, .35); }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .tab { background: transparent; color: var(--text); border: 1px solid var(--line); padding: 8px 14px; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
  .progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 12px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .result-head { font-size: 1.1rem; font-weight: 700; }
  .explain { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--accent-weak); white-space: pre-wrap; }
  .explain .src { display: block; margin-top: 8px; color: var(--muted); font-size: .82rem; }
  .basics { margin-top: 12px; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line);
    border-left: 4px solid var(--accent); background: var(--card); white-space: pre-wrap; }
  .basics .bt { display: block; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
  .explain .bt { display: block; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  /* 基礎からの解説（長文・節つき） */
  .basics.deep { white-space: normal; }
  .deep .dsec { margin: 18px 0 6px; font-size: .95rem; color: var(--accent); border-bottom: 1px dashed var(--line); padding-bottom: 3px; }
  .deep .dp { margin: 6px 0; line-height: 1.85; }
  .deep .dul { margin: 6px 0; padding-left: 1.3em; line-height: 1.8; }
  .deep .dul li { margin: 6px 0; }
  /* 用語の注釈 */
  .term { border-bottom: 1.5px dotted var(--accent); cursor: help; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--card); color: var(--text); width: 100%; max-width: 720px; max-height: 78vh; overflow: auto; padding: 16px 18px 24px; border-radius: 16px 16px 0 0; box-shadow: 0 -4px 20px rgba(0, 0, 0, .25); }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 1.05rem; margin-bottom: 4px; }
  .sheet-k { margin-top: 12px; font-size: .8rem; font-weight: 700; color: var(--accent); }
  .sheet-p { margin: 4px 0 0; line-height: 1.8; white-space: pre-wrap; }
  .sheet-rel { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: .85rem; color: var(--muted); }
  .verdict { font-weight: 700; margin: 12px 0 0; }
  /* 回答ボタンのグラデーション（濃い → 薄い）。「わからない」は白 */
  button.conf { font-weight: 700; border: 1px solid transparent; box-shadow: none; }
  button.conf2 { background: var(--accent); color: #fff; box-shadow: 0 2px 6px rgba(196, 98, 63, .35); }
  button.conf1 { background: color-mix(in srgb, var(--accent) 55%, var(--card)); color: var(--text); }
  button.conf0 { background: color-mix(in srgb, var(--accent) 25%, var(--card)); color: var(--text); }
  .confrow button:disabled { opacity: .6; }
  .verdict.ok { color: var(--ok); } .verdict.ng { color: var(--ng); }
  /* ---------- 記号（A〜D）・正解の強調・選択肢ごとの理由・番号・目次 ---------- */
  .letter { flex: 0 0 auto; width: 1.8em; height: 1.8em; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: .85rem; background: var(--accent-weak); color: var(--accent); margin-top: 1px; }
  .otext { flex: 1 1 auto; min-width: 0; }
  label.opt.correct, .optrow.correct { background: var(--okx); border: 2px solid var(--ok); padding: 9px 11px; }
  label.opt.wrong, .optrow.wrong { background: var(--ngx); border: 2px solid var(--ng); padding: 9px 11px; }
  label.opt.correct .letter, .optrow.correct .letter { background: var(--ok); color: #fff; }
  label.opt.wrong .letter, .optrow.wrong .letter { background: var(--ng); color: #fff; }
  label.opt.dim, .optrow.dim { opacity: .62; }
  .pill { flex: 0 0 auto; font-size: .78rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; color: #fff; white-space: nowrap; align-self: center; margin-left: auto; }
  .pill.ok { background: var(--ok); }
  .pill.ng { background: var(--ng); }
  .why { margin: -4px 0 10px; padding: 8px 12px 8px 14px; border-left: 4px solid var(--line); border-radius: 0 8px 8px 0; background: var(--bg); font-size: .9rem; line-height: 1.8; }
  .why.ok { border-left-color: var(--ok); background: var(--ok-bg); }
  .why.ng { border-left-color: var(--ng); background: var(--ng-bg); }
  .why .wt { font-weight: 700; margin-right: .5em; }
  .why.ok .wt { color: var(--ok); }
  .why.ng .wt { color: var(--ng); }
  .card.res-ok { border: 2px solid var(--ok); background: color-mix(in srgb, var(--ok-bg) 35%, var(--card)); }
  .card.res-ng { border: 2px solid var(--ng); background: color-mix(in srgb, var(--ng-bg) 35%, var(--card)); }
  .vbar { font-size: 1.1rem; font-weight: 700; padding: 8px 14px; border-radius: 10px; margin: 0 0 12px; color: #fff; }
  .vbar.ok { background: var(--ok); }
  .vbar.ng { background: var(--ng); }
  .qno { font-weight: 700; background: var(--accent); color: #fff; padding: 2px 10px; border-radius: 999px; }
  .qread { margin-left: auto; }
  .card[id^="q-"] { scroll-margin-top: 8px; }
  .qlayout { display: block; }
  .qside { display: none; }
  .qgrid { display: flex; flex-wrap: wrap; gap: 4px; }
  .qc { min-width: 2.6em; padding: 3px 4px; text-align: center; font-size: .74rem; line-height: 1.5; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); cursor: pointer; font-variant-numeric: tabular-nums; }
  .qc.read { background: var(--accent-weak); border-color: var(--accent); }
  .qc.ok { background: var(--okx); border-color: var(--ok); }
  .qc.ng { background: var(--ngx); border-color: var(--ng); }
  .qc.off { opacity: .3; }
  .qc.cur { outline: 3px solid var(--text); outline-offset: 1px; font-weight: 700; }
  .qleg { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .74rem; color: var(--muted); margin: 6px 0 8px; }
  .qleg i { display: inline-block; width: .9em; height: .9em; border: 1px solid var(--line); border-radius: 3px; vertical-align: -1px; margin-right: 4px; background: var(--card); }
  .qleg i.read { background: var(--accent-weak); border-color: var(--accent); }
  .qleg i.ok { background: var(--okx); border-color: var(--ok); }
  .qleg i.ng { background: var(--ngx); border-color: var(--ng); }
  .qtoc .qsum { font-size: .9rem; font-weight: 700; margin: 0 0 4px; }
  @media (min-width: 1100px) {
    .qlayout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 20px; align-items: start; }
    .qside { display: block; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
    .qtop { display: none; }
  }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.click { cursor: pointer; }
  tr.click:hover { background: var(--accent-weak); }
  .bar { height: 8px; background: var(--line); border-radius: 999px; min-width: 80px; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 999px; }
  .small { font-size: .85rem; color: var(--muted); }
  .check { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  select, input[type=text] { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
  details.more > summary { cursor: pointer; color: var(--accent); margin-top: 8px; }
  .banner { background: var(--ng-bg); color: var(--ng); padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; }
  .notice { background: var(--accent-weak); padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; }
  .timeline { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  input[type=number] { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); width: 90px; }
  /* タイマー（画面と一緒にスクロールします。貼りつけはしません） */
  .timer { background: var(--bg); padding: 6px 0 8px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
  .trow { display: grid; grid-template-columns: 7.5em 1fr 11em; gap: 10px; align-items: center; padding: 3px 8px; border-radius: 8px; border: 1px solid transparent; opacity: .55; }
  .trow.active { opacity: 1; border-color: var(--line); background: var(--card); }
  .trow.over { border-color: var(--ng); }
  .tname { font-size: .85rem; font-weight: 700; }
  .tgauge { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .tgauge > div { height: 100%; background: var(--ok); border-radius: 999px; transition: width .4s linear; }
  .tgauge > div.warn { background: var(--warn); }
  .tgauge > div.over { background: var(--ng); }
  .ttext { font-size: .82rem; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ttext.over { color: var(--ng); font-weight: 700; }
  .tsub { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .8rem; color: var(--muted); padding: 2px 8px 0; }
  /* スマホ: 1行にまとめる（いまの段階のゲージだけを、細く出す） */
  @media (max-width: 560px) {
    .timer { padding: 2px 0 4px; margin-bottom: 6px; }
    .trow:not(.active) { display: none; }
    .trow { grid-template-columns: 4.4em 1fr auto; gap: 6px; padding: 2px 4px; }
    .tname { font-size: .75rem; }
    .tgauge { height: 6px; }
    .ttext { font-size: .75rem; grid-column: auto; text-align: right; }
    .tsub { font-size: .72rem; padding: 0 4px; }
    .tsub button { padding: 3px 8px; }
  }
  /* 回答ボタン（自信つき） */
  .confrow { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; }
  .confrow button { flex: 1 1 0; min-width: 4.6em; padding: 12px 4px; }
  .confrow .unk { flex: 0 0 auto; }
  @media (max-width: 560px) { .confrow .unk { flex: 1 1 100%; } }
  button.primary.big { width: 100%; padding: 14px 16px; font-size: 1.05rem; }
  /* スライダー */
  .slrow { margin: 14px 0; }
  .slhead { display: flex; justify-content: space-between; gap: 8px; font-size: .9rem; font-weight: 700; }
  .slhead .slv { color: var(--accent); text-align: right; white-space: nowrap; flex: 0 0 auto; }
  .slrow input[type=range] { width: 100%; margin: 6px 0 0; }
  .slends { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); }
  /* AIに質問 */
  .airow { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  details.more.card > summary { font-weight: 700; }
  /* 教科書（読み物） */
  .tb-lead { margin: 4px 0 10px; font-size: .92rem; }
  .tb-prog { margin: 8px 0 4px; }
  .tb-group { margin: 18px 0 6px; font-size: .88rem; font-weight: 700; color: var(--muted); }
  .tb-chap { display: flex; gap: 12px; align-items: center; padding: 12px 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: var(--card); cursor: pointer; }
  .tb-chap:hover { border-color: var(--accent); }
  .tb-no { flex: 0 0 auto; min-width: 2.9em; text-align: center; font-weight: 700; color: var(--accent); background: var(--accent-weak); border-radius: 8px; padding: 4px 6px; font-size: .9rem; }
  .tb-chap.done .tb-no { background: var(--ok-bg); color: var(--ok); }
  .tb-ct { flex: 1 1 auto; min-width: 0; }
  .tb-ct strong { font-size: .95rem; display: block; line-height: 1.5; }
  .tb-ct span { display: block; font-size: .82rem; color: var(--muted); line-height: 1.6; }
  .tb-title { font-size: 1.12rem; line-height: 1.5; margin: 6px 0 10px; }
  .tb-goal { font-size: .9rem; background: var(--accent-weak); border-radius: 10px; padding: 12px 16px; margin: 10px 0 6px; }
  .tb-goal strong { color: var(--accent); }
  .tb-goal ul { margin: 6px 0 0; padding-left: 1.3em; }
  .tb-body { font-size: .93rem; line-height: 1.95; }
  .tb-h { font-size: 1rem; margin: 30px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--accent); line-height: 1.5; }
  .tb-p { margin: 10px 0; }
  .tb-ul { margin: 10px 0; padding-left: 1.3em; }
  .tb-ul li { margin: 6px 0; }
  .tb-box { margin: 14px 0; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); line-height: 1.9; }
  .tb-bt { font-size: .82rem; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .tb-box.def { border-left: 4px solid var(--accent); }
  .tb-box.analogy { background: var(--accent-weak); border-color: transparent; }
  .tb-box.note { border-left: 4px solid var(--warn); }
  .tb-box.note .tb-bt { color: var(--warn); }
  .tb-tp { margin: 6px 0; }
  .tb-ex { margin: 14px 0; border: 1px dashed var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
  .tb-ex .tb-bt { padding: 6px 12px; margin: 0; background: var(--bg); border-bottom: 1px dashed var(--line); }
  .tb-ex pre { margin: 0; padding: 10px 12px; font-size: .86rem; line-height: 1.7; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Consolas, "Yu Gothic UI", monospace; }
  .tb-flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 14px 0; }
  .tb-flow .fb { border: 1px solid var(--accent); background: var(--card); padding: 6px 12px; border-radius: 8px; font-size: .92rem; line-height: 1.6; }
  .tb-flow .fa { color: var(--accent); font-weight: 700; }
  .tb-recap { font-size: .9rem; margin: 26px 0 8px; padding: 12px 16px; border-radius: 10px; background: var(--ok-bg); }
  .tb-recap strong { color: var(--ok); }
  .tb-recap ol { margin: 6px 0 0; padding-left: 1.4em; }
  .tb-foot { margin-top: 18px; }
  .tb-nav { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin: 0 0 12px; flex-wrap: wrap; }
  @media (max-width: 560px) {
    .tb-body { font-size: .83rem; line-height: 1.9; }
    .tb-title { font-size: 1rem; }
    .tb-h { font-size: .9rem; }
    .tb-goal, .tb-recap { font-size: .8rem; }
    .tb-lead { font-size: .82rem; }
    .tb-ct strong { font-size: .86rem; }
    .tb-ct span { font-size: .76rem; }
    .tb-ex pre { font-size: .76rem; }
    .tb-bt { font-size: .74rem; }
    .tb-flow .fb { font-size: .8rem; }
    .tb-nav button { padding: 8px 12px; }
  }

  /* ---------- 広い画面（PC）向け：横に広げる ---------- */
  .tb-layout { display: block; }
  .tb-side { display: none; }
  .tb-sg { margin: 12px 0 4px; font-size: .74rem; font-weight: 700; color: var(--muted); line-height: 1.5; }
  .tb-sg:first-child { margin-top: 0; }
  .tb-si { display: flex; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 8px; font-size: .84rem; line-height: 1.5; cursor: pointer; border: 1px solid transparent; }
  .tb-si:hover { background: var(--accent-weak); }
  .tb-si.cur { background: var(--accent); color: #fff; }
  .tb-si .sn { flex: 0 0 auto; min-width: 2.6em; font-weight: 700; color: var(--accent); }
  .tb-si.cur .sn { color: #fff; }
  .tb-si.done .sn { color: var(--ok); }
  .tb-si.cur.done .sn { color: #fff; }
  .tb-si .st { flex: 1 1 auto; min-width: 0; }
  @media (min-width: 1000px) {
    #tbtoc { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    #tbtoc > .card, #tbtoc > .tb-group, #tbtoc > p { grid-column: 1 / -1; }
  }
  @media (min-width: 1100px) {
    main { max-width: 1200px; }
    main.wide { max-width: 1560px; }
    .tb-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
    .tb-side { display: block; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; padding: 10px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
    .tb-layout > .tb-mainc { max-width: 1180px; }
  }
  @media (min-width: 1400px) {
    .tb-body { font-size: 1.02rem; }
    .tb-title { font-size: 1.25rem; }
    .tb-h { font-size: 1.1rem; }
    .tb-goal, .tb-recap { font-size: .98rem; }
    .tb-box { font-size: 1rem; }
    .tb-ex pre { font-size: .94rem; }
    .tb-flow .fb { font-size: 1rem; }
  }
  @media (min-width: 1900px) {
    main.wide { max-width: 1840px; }
    main { max-width: 1400px; }

<body>

<!-- 設定と問題データ（tools/build_data.py が、config.json と data/sets/*.json から自動生成します） -->
<script src="data/questions.bundle.js"></script>

<script>
(function () {
  "use strict";

  var LET = "ABCDEFGH";   // 選択肢の記号

  var PREFIX = CFG.storagePrefix || "quiz";
  var K_HIST = PREFIX + "History";
  var K_QSTAT = PREFIX + "QStats";
  var K_RUN = PREFIX + "InProgress";
  var K_PREFS = PREFIX + "Prefs";
  var K_TIMER = PREFIX + "Timer";
  var K_BACKUP = PREFIX + "Backup";
  var K_QREAD = PREFIX + "QRead";   // 問題一覧の「既読」（この端末のみ。同期はしません）
  var storageOK = true;
  function load(key, def) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { storageOK = false; return def; }
  }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { storageOK = false; } }
  function remove(key) { try { localStorage.removeItem(key); } catch (e) { storageOK = false; } }
  try { localStorage.setItem("_t", "1"); localStorage.removeItem("_t"); } catch (e) { storageOK = false; }

  var run = null;      // 解いている最中の回
  var tab = "solve";

  /* ---------- 共通の部品 ---------- */
  function h(tag, attrs, children) {

  }
  var qScroll = null;
  function clear() { stopTick(); if (qScroll) { window.removeEventListener("scroll", qScroll); qScroll = null; } while (app.firstChild) app.removeChild(app.firstChild); }
  function shuffle(a) {

  }
  function pct(n, d) { return d ? Math.round((n / d) * 100) : 0; }
  function pad(n) { return ("0" + n).slice(-2); }

  }
  function optById(q, id) { return q.options.filter(function (o) { return o.id === id; })[0]; }
  function optLines(q, ids) {
    return ids.map(function (id) { var o = optById(q, id); return "・" + (o ? o.t : id); }).join("\n");
  }
  function qreadMap() { return load(K_QREAD, {}); }
  function isQRead(id) { return !!qreadMap()[id]; }
  function setQRead(id, v) { var m = qreadMap(); if (v) m[id] = 1; else delete m[id]; m._last = id; save(K_QREAD, m); }
  function autoRead(id) { var m = qreadMap(); m[id] = 1; m._last = id; save(K_QREAD, m); }
  function letterEl(i) { return h("span", { class: "letter", text: LET.charAt(i) }); }
  function qnoTag(q) { return h("span", { class: "qno", text: "No." + q._no }); }
  // 選択肢ごとの理由（正解の理由／間違いの理由）の箱。理由が無いときは null
  function whyBox(q, id, isAns, i, isSel) {
    var t = q.ox && q.ox[id];
    if (!t) return null;
    var tt = (isAns ? "○ 正解の理由" : "× 間違いの理由") + (isSel && !isAns ? "（あなたの回答）" : "");
    return h("div", { class: "why " + (isAns ? "ok" : "ng") }, [letterEl(i), h("div", { class: "wb" }, [h("span", { class: "wt", text: tt })].concat(annotate(t)))]);
  }
  // 選択肢（A〜D）をすべて並べたあとに、まとめて出す「各選択肢の理由」
  function whysBox(q, ids, sel) {
    if (!q.ox) return null;
    var box = h("div", { class: "whys" }, [h("div", { class: "whys-h", text: "各選択肢の理由" })]), n = 0;
    ids.forEach(function (id, i) {
      var w = whyBox(q, id, q.answer.indexOf(id) >= 0, i, !!sel && sel.indexOf(id) >= 0);
      if (w) { box.appendChild(w); n++; }
    });
    return n ? box : null;
  }
  function answerLetters(q, ord) {

  }
  function basicsBlock(q) {
    var box = h("div", { class: "basics" }, [
      h("span", { class: "bt", text: "基礎からの解説（初心者向け）" }),
      document.createTextNode(q.basics || "")
    ]);
    if (q.figs && q.figs.length) box.appendChild(h("div", { class: "figbox" }, [h("h4", { class: "dsec", text: "イメージ（図とサンプル）" }), figsNode(q)]));
    return box;
  }

  /* ---------- 用語集と、用語の注釈 ---------- */
  var GLOSS = window.GLOSSARY || [];
  var gIndex = null, annCtx = {};
  function resetAnn() { annCtx = {}; }
  function glossIndex() {
    if (gIndex) return gIndex;
    var arr = [];
    GLOSS.forEach(function (g, gi) {
      [g.term].concat(g.aliases || []).forEach(function (w) { if (w) arr.push({ w: w, lw: w.toLowerCase(), gi: gi }); });
    });
    arr.sort(function (a, b) { return b.w.length - a.w.length; });
    gIndex = arr;
    return arr;
  }
  function isWordCh(c) { return !!c && /[A-Za-z0-9_]/.test(c); }
  // 文章の中の用語に、点線の印をつける（同じ用語は、問題ごとに最初の1回だけ）。ノードの配列を返す
  function annotate(text) {
    text = String(text == null ? "" : text);
    if (!GLOSS.length || load(K_PREFS, {}).gloss === false) return [text];
    var low = text.toLowerCase(), hits = [];
    glossIndex().forEach(function (it) {
      if (annCtx[it.gi]) return;
      var from = 0;
      while (true) {
        var p = low.indexOf(it.lw, from);
        if (p < 0) return;
        var e = p + it.lw.length;
        var asciiStart = /[A-Za-z0-9_]/.test(it.lw.charAt(0)), asciiEnd = /[A-Za-z0-9_]/.test(it.lw.charAt(it.lw.length - 1));
        var okB = !(asciiStart && isWordCh(text.charAt(p - 1))) && !(asciiEnd && isWordCh(text.charAt(e)));
        var overlap = hits.some(function (h2) { return p < h2.e && e > h2.p; });
        if (okB && !overlap) { hits.push({ p: p, e: e, gi: it.gi }); annCtx[it.gi] = true; return; }
        from = p + 1;
      }
    });
    hits.sort(function (a, b) { return a.p - b.p; });
    var out = [], pos = 0;
    hits.forEach(function (ht) {
      if (ht.p > pos) out.push(text.slice(pos, ht.p));
      out.push(h("span", { class: "term", tabindex: "0", role: "button", onclick: function (ev) { ev.stopPropagation(); showTerm(ht.gi); } }, [text.slice(ht.p, ht.e)]));
      pos = ht.e;
    });
    if (pos < text.length) out.push(text.slice(pos));
    return out;
  }
  function termBody(g) {
    var nodes = [];
    [["意味", g.meaning], ["ニュアンス・よくある勘違い", g.nuance], ["使われ方", g.usage], ["実務の場面", g.case]].forEach(function (r) {
      if (!r[1]) return;
      nodes.push(h("div", { class: "sheet-k", text: r[0] }));
      nodes.push(h("p", { class: "sheet-p", text: r[1] }));
    });
    return nodes;
  }
  function glossIdx(term) { for (var i = 0; i < GLOSS.length; i++) if (GLOSS[i].term === term) return i; return -1; }
  function showTerm(gi) {
    var g = GLOSS[gi];

    var close = function () { if (bg && bg.parentNode) bg.parentNode.removeChild(bg); };
    var box = h("div", { class: "sheet" }, [
      h("div", { class: "sheet-head" }, [h("strong", { text: g.term + (g.reading ? "（" + g.reading + "）" : "") }), h("button", { class: "ghost small", text: "閉じる", onclick: close })])
    ]);

    var rel = (g.related || []).map(function (t) { return { t: t, i: glossIdx(t) }; }).filter(function (r) { return r.i >= 0; });
    if (rel.length) {
      var rr = h("div", { class: "sheet-rel" }, [h("span", { text: "関連:" })]);
      rel.forEach(function (r) { rr.appendChild(h("button", { class: "ghost small", text: r.t, onclick: function () { close(); showTerm(r.i); } })); });
      box.appendChild(rr);
    }

    document.body.appendChild(bg);
  }
  function viewGloss() {
    var box = h("div"), card = h("div", { class: "card" });
    card.appendChild(h("h2", { text: "用語集" }));
    card.appendChild(h("p", { class: "small", text: "AIやClaudeを使う仕事・開発で、よく出てくる言葉の意味・ニュアンス・使われ方・実務の場面です（自作。公式の定義ではありません）。解説の中の点線の言葉は、タップするとここと同じ説明が出ます。" }));
    var search = h("input", { type: "search", placeholder: "用語を検索（例: キャッシュ）", style: "width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)" });
    var count = h("p", { class: "small" }), list = h("div");
    card.appendChild(search); card.appendChild(count);
    function refresh() {
      var kw = search.value.trim().toLowerCase();
      while (list.firstChild) list.removeChild(list.firstChild);
      var shown = GLOSS.filter(function (g) {
        if (!kw) return true;
        return ([g.term, g.reading || "", g.meaning || "", g.nuance || "", g.usage || "", g.case || ""].concat(g.aliases || [])).join(" ").toLowerCase().indexOf(kw) >= 0;
      });
      count.textContent = shown.length + " / " + GLOSS.length + " 語";
      shown.forEach(function (g) {
        var d = h("details", { class: "more" }, [h("summary", { text: g.term + (g.reading ? "（" + g.reading + "）" : "") + "　" + (g.meaning || "").slice(0, 40) + ((g.meaning || "").length > 40 ? "…" : "") })]);

  // 長文の解説（背景 → 問題の意味 → 正解の意味 → ほかの選択肢 → たとえ → 実務 → 覚えること）。無い問題は、短い解説を出す
  function deepText(q) {

    if (d.meaning) sec("問題の意味", para(d.meaning));
    if (d.answer) sec("正解の意味", para(d.answer));

    if (d.others && d.others.length && !q.ox) sec("ほかの選択肢が違う理由", h("ul", { class: "dul" }, d.others.map(function (x) { return h("li", null, [h("strong", { text: x.t }), "　→　"].concat(annotate(x.d))); })));
    if (d.analogy) sec("たとえるなら", para(d.analogy));

    box.appendChild(h("p", { class: "small", style: "margin-top:14px", text: "※ 公式の講座とドキュメントをもとに作った、自作の解説です。公式の見解ではありません。" }));

  // AIに質問: 質問文をコピーして、Claude を開く（開いた先の入力欄に事前入力されない場合は、貼り付けてください）

    ids.forEach(function (id, i) { lines.push("・" + LET.charAt(i) + ". " + optById(q, id).t); });
    lines.push("【正解】" + q.answer.map(name).join(" ／ "));
    lines.push("【私の回答】" + (unk ? "わからなかった" : sel.map(name).join(" ／ ") + (ok ? "（正解）" : "（不正解）")));
    lines.push("", "知りたいこと: なぜその答えになるのか。ほかの選択肢はなぜ違うのか。実務ではどんな場面で使うのか。出てくる専門用語の意味。");
    return lines.join("\n");
  }
  function aiBlock(q, sel, ok, unk, ord) {
    var full = buildAskText(q, sel, ok, unk, ord);
    var short = full.length > 700 ? full.slice(0, 700) + "…" : full;
    var msg = h("span", { class: "small" });
    return h("div", { class: "airow" }, [
      h("button", { class: "ghost", text: "AIに質問する（Claudeを開く）", onclick: function () {
        copyText(full, msg, "質問文をコピーしました。開いた画面の入力欄が空なら、貼り付けてください。");
        window.open("https://claude.ai/new?q=" + encodeURIComponent(short), "_blank", "noopener");
      } }),
      h("button", { class: "ghost", text: "質問文だけコピー", onclick: function () { copyText(full, msg, "質問文をコピーしました。"); } }),
      msg
    ]);
  }
  function statBadge(s) {
    if (!s) return h("span", { class: "badge", text: "未回答" });
    var lh = s.hist && s.hist.length ? s.hist[s.hist.length - 1] : null;
    var ct = lh ? (lh.unk ? "　わからない" : lh.conf === 2 ? "　自信あり" : lh.conf === 1 ? "　いまひとつ" : lh.conf === 0 ? "　自信なし" : "") : "";
    return h("span", { class: "badge " + (s.last ? "ok" : "ng"), text: "前回 " + (s.last ? "○" : "×") + ct + "　正解 " + s.c + "/" + s.n });
  }

  /* ---------- タイマー ----------
     目標時間は「1問あたりの秒数」で持ち、回の問題数をかけて、全体の目標にします。
     「回答する前」と「回答したあと（解説を読む時間）」を、別々に数えます。
     目標を過ぎても止めません（ゲージが赤くなり、超過時間が出ます）。 */
  var TIMER_DEFAULT = { on: true, ans: 90, rev: 120 };
  (function () {
    var t = CFG.timer || {};
    if (t.answerSec) TIMER_DEFAULT.ans = t.answerSec;
    if (t.reviewSec) TIMER_DEFAULT.rev = t.reviewSec;
    if (t.enabled === false) TIMER_DEFAULT.on = false;
  })();
  function clampSec(v, def) {
    v = parseInt(v, 10);
    if (isNaN(v)) return def;
    return Math.max(5, Math.min(1800, v));
  }
  function loadTimer() {
    var t = load(K_TIMER, null) || {};
    return {
      on: t.on == null ? TIMER_DEFAULT.on : !!t.on,
      ans: clampSec(t.ans, TIMER_DEFAULT.ans),
      rev: clampSec(t.rev, TIMER_DEFAULT.rev)
    };
  }
  function fmtSec(s) {
    s = Math.max(0, Math.round(s));
    return Math.floor(s / 60) + ":" + pad(s % 60);
  }
  function fmtMin(s) {
    s = Math.round(s);
    var m = Math.floor(s / 60), r = s % 60;
    return m ? (r ? m + "分" + r + "秒" : m + "分") : r + "秒";
  }
  function timerOn(r) { return !!(r && r.timer && r.timer.on && r.t); }
  // 回答済みの問題だけの合計時間（途中で止めた、解いている最中の問題は含めない）
  function sumTimes(r) {
    var a = 0, v = 0;
    r.results.forEach(function (x) { a += x.ta || 0; v += x.tr || 0; });
    return { a: a, r: v };
  }

  var tickH = null, tickLast = 0, tickUI = null, tickSaved = 0, phase = "ans", paused = false;
  function flushTick() {
    if (!tickH || !timerOn(run)) return;
    var now = Date.now(), d = (now - tickLast) / 1000;
    tickLast = now;
    if (paused || document.hidden) return;   // 一時停止中・別のタブを見ている間は数えない
    if (d > 5) d = 5;                        // パソコンのスリープなどで、一気に増えるのを防ぐ
    if (phase === "ans") {
      run.t.a += d;
      if (run.cur) run.cur.a += d;
    } else {
      run.t.r += d;
      var lr = run.results[run.results.length - 1];
      if (lr) lr.tr = (lr.tr || 0) + d;
    }
  }
  function stopTick() {
    flushTick();
    if (tickH) { clearInterval(tickH); tickH = null; }
    tickUI = null;
  }
  function startTick(ui) {
    if (!timerOn(run)) return;
    tickUI = ui; tickLast = Date.now(); tickSaved = tickLast;
    ui.update();
    tickH = setInterval(function () {
      flushTick();
      if (tickUI) tickUI.update();
      if (Date.now() - tickSaved > 5000) { tickSaved = Date.now(); save(K_RUN, run); }
    }, 500);
  }
  // 出題画面の上に貼りつく、残り時間のゲージ
  function timerPanel() {
    var T = run.timer, n = run.order.length;
    var rows = [
      { k: "a", name: "回答の残り", used: function () { return run.t.a; }, bud: T.ans * n },
      { k: "r", name: "解説の残り", used: function () { return run.t.r; }, bud: T.rev * n }
    ];
    var box = h("div", { class: "timer" });
    rows.forEach(function (r) {
      r.fill = h("div", { style: "width:100%" });
      r.txt = h("span", { class: "ttext" });
      r.el = h("div", { class: "trow" }, [h("span", { class: "tname", text: r.name }), h("div", { class: "tgauge" }, [r.fill]), r.txt]);
      box.appendChild(r.el);
    });
    var cur = h("span");
    var pauseBtn = h("button", { class: "ghost small", text: "一時停止", onclick: function () {
      paused = !paused;
      pauseBtn.textContent = paused ? "再開する" : "一時停止";
      update();
    } });
    // 一時停止中に、選択肢を押す・回答するなどの操作をしたら、自動で再開する
    function resume() {
      if (!paused) return;
      paused = false;
      pauseBtn.textContent = "一時停止";
      update();
    }
    box.appendChild(h("div", { class: "tsub" }, [cur, pauseBtn]));
    function update() {
      rows.forEach(function (r) {
        var used = r.used(), rem = r.bud - used, frac = Math.max(0, rem / r.bud);
        r.fill.style.width = (frac * 100) + "%";
        r.fill.className = rem <= 0 ? "over" : frac <= 0.25 ? "warn" : "";
        r.el.className = "trow" + (r.k === (phase === "ans" ? "a" : "r") ? " active" : "") + (rem <= 0 ? " over" : "");
        r.txt.className = "ttext" + (rem <= 0 ? " over" : "");
        r.txt.textContent = (rem <= 0 ? "超過 +" + fmtSec(-rem) : "残り " + fmtSec(rem)) + "（" + fmtSec(used) + " / " + fmtSec(r.bud) + "）";
      });
      var q = phase === "ans" ? (run.cur ? run.cur.a : 0) : (run.results.length ? (run.results[run.results.length - 1].tr || 0) : 0);
      cur.textContent = (paused ? "一時停止中　" : "") + "この問題の" + (phase === "ans" ? "回答" : "解説") + ": " + fmtSec(q) + "（1問の目安 " + fmtSec(phase === "ans" ? T.ans : T.rev) + "）";
    }
    return { el: box, update: update, resume: resume };
  }
  // 結果画面の「時間」カード
  function timeCard(r, finished) {
    if (!timerOn(r)) return null;
    var T = r.timer, n = r.order.length, cnt = finished ? n : Math.max(1, r.results.length);
    var card = h("div", { class: "card" });
    card.appendChild(h("h2", { text: "時間" }));
    var t = h("table");
    t.appendChild(h("tr", null, [h("th", { text: "" }), h("th", { class: "num", text: "かかった時間" }), h("th", { class: "num", text: "目標" }), h("th", { class: "num", text: "差" })]));
    var sm = sumTimes(r);
    [["回答", sm.a, T.ans * cnt], ["解説を読む", sm.r, T.rev * cnt]].forEach(function (x) {
      var diff = x[1] - x[2];
      t.appendChild(h("tr", null, [
        h("td", { text: x[0] }),
        h("td", { class: "num", text: fmtSec(x[1]) }),
        h("td", { class: "num", text: fmtSec(x[2]) }),
        h("td", { class: "num", text: (diff > 0 ? "+" : "−") + fmtSec(Math.abs(diff)) + (diff > 0 ? "（超過）" : "（余り）") })
      ]));
    });
    card.appendChild(t);
    var ans = r.results.length;
    if (ans) card.appendChild(h("p", { class: "small", text: "1問あたりの平均: 回答 " + fmtSec(sm.a / ans) + "（目標 " + fmtSec(T.ans) + "）、解説 " + fmtSec(sm.r / ans) + "（目標 " + fmtSec(T.rev) + "）" + (finished ? "" : "。中断した回は、回答した " + ans + " 問分の目標と比べています。") }));
    var slow = r.results.filter(function (x) { return x.ta != null; }).sort(function (a, b) { return b.ta - a.ta; }).slice(0, 3);
    if (slow.length) card.appendChild(h("p", { class: "small", text: "回答に時間がかかった問題: " + slow.map(function (x) { return (QMAP[x.qid] ? "No." + QMAP[x.qid]._no : x.qid) + "（" + fmtSec(x.ta) + "）"; }).join("、") }));
    return card;
  }

  /* ---------- 記録（履歴・問題別成績） ---------- */
  function recordAnswer(qid, ok, conf, unk) {
    var all = load(K_QSTAT, {});
    var s = all[qid] || { n: 0, c: 0, last: null, lastAt: null, hist: [] };
    s.n++; if (ok) s.c++;
    s.last = ok; s.lastAt = Date.now();
    var he = { ts: s.lastAt, ok: ok };
    if (conf != null) he.conf = conf;   // 0=自信なし 1=いまひとつ 2=自信あり
    if (unk) he.unk = true;             // わからない
    s.hist.push(he);
    if (s.hist.length > 30) s.hist = s.hist.slice(-30);
    all[qid] = s;
    save(K_QSTAT, all);
  }
  function upsertHistory(r, status) {
    var list = load(K_HIST, []);
    var entry = {
      id: r.id, ts: r.id, at: fmt(r.id), status: status, mode: r.mode || "",
      total: r.order.length, answered: r.results.length,
      correct: r.results.filter(function (x) { return x.ok; }).length,
      details: r.results.map(function (x) { return { q: x.qid, ok: x.ok, conf: x.conf, unk: x.unk, sel: x.sel, ta: x.ta != null ? Math.round(x.ta) : null, tr: x.tr != null ? Math.round(x.tr) : null }; }),
      time: timerOn(r) ? { a: Math.round(sumTimes(r).a), r: Math.round(sumTimes(r).r), ta: r.timer.ans, tr: r.timer.rev } : null
    };
    var found = -1;
    for (var i = 0; i < list.length; i++) if (list[i].id === r.id) { found = i; break; }
    if (found >= 0) list[found] = entry; else list.unshift(entry);
    save(K_HIST, list.slice(0, 50));
    if (typeof syncSoon === "function") syncSoon();
  }
  function validRun(r) {
    return r && Array.isArray(r.order) && Array.isArray(r.results) && r.order.length > 0 &&
      r.order.every(function (id) { return QMAP[id]; });
  }

  /* ---------- 記録の保存・取り込み（手動で端末間をつなぐ） ---------- */
  /*XFER_BEGIN*/
  var XFER_VERSION = 1;
  function examKey() { return PREFIX.indexOf("Associate") >= 0 ? "associate" : "developer"; }
  function numOr(x) { return typeof x === "number" && isFinite(x) ? x : 0; }
  function okCount(arr) { return (arr || []).filter(function (x) { return x && x.ok; }).length; }

  // 問題別成績の合算。同じ記録を何度読み込んでも結果が変わらないように、正誤の履歴は ts で重複を除く。
  // 30件より古い分は履歴から消えているので、件数（n・c）の差分から推定して足す（端末をまたいで30件を超えた場合は、わずかな誤差が出ることがある）。
  function mergeQStats(local, incoming) {
    var out = {}, ids = {};
    Object.keys(local || {}).forEach(function (k) { ids[k] = true; });
    Object.keys(incoming || {}).forEach(function (k) { ids[k] = true; });
    Object.keys(ids).forEach(function (id) {
      var a = local && typeof local[id] === "object" ? local[id] : null;
      var b = incoming && typeof incoming[id] === "object" ? incoming[id] : null;
      if (!a && !b) return;
      var ha = (a && a.hist) || [], hb = (b && b.hist) || [];
      var seen = {}, uniq = [];
      ha.concat(hb).forEach(function (x) {
        if (!x || typeof x.ts !== "number") return;
        var key = x.ts + ":" + (x.ok ? "1" : "0");
        if (seen[key]) return;
        seen[key] = true;
        var ent = { ts: x.ts, ok: !!x.ok };
        if (typeof x.conf === "number") ent.conf = x.conf;
        if (x.unk) ent.unk = true;
        uniq.push(ent);
      });
      uniq.sort(function (p, q) { return p.ts - q.ts; });
      var olderN = Math.max(numOr(a && a.n) - ha.length, numOr(b && b.n) - hb.length, 0);
      var olderC = Math.max(numOr(a && a.c) - okCount(ha), numOr(b && b.c) - okCount(hb), 0);
      var n = olderN + uniq.length;
      var c = olderC + okCount(uniq);
      var last = null, lastAt = null;
      if (uniq.length) { last = uniq[uniq.length - 1].ok; lastAt = uniq[uniq.length - 1].ts; }
      else {
        [a, b].forEach(function (s) {
          if (s && typeof s.lastAt === "number" && (lastAt === null || s.lastAt > lastAt)) { lastAt = s.lastAt; last = !!s.last; }
        });
      }
      out[id] = { n: n, c: Math.min(c, n), last: last, lastAt: lastAt, hist: uniq.slice(-30) };
    });
    return out;
  }

  // 履歴の合算。回の開始時刻（id）で同じものを1つにする。回答数が多い方、同数なら「中断」でない方を残す。
  function mergeHistory(local, incoming) {
    var map = {}, out = [];
    (local || []).concat(incoming || []).forEach(function (e) {
      if (!e || typeof e !== "object" || typeof e.id !== "number") return;
      var cur = map[e.id];
      if (!cur) { map[e.id] = e; return; }
      var ca = numOr(cur.answered != null ? cur.answered : cur.total);
      var na = numOr(e.answered != null ? e.answered : e.total);
      if (na > ca || (na === ca && cur.status === "interrupted" && e.status !== "interrupted")) map[e.id] = e;
    });
    Object.keys(map).forEach(function (k) { out.push(map[k]); });
    out.sort(function (x, y) { return y.id - x.id; });
    return out.slice(0, 50);
  }
  /*XFER_END*/

  function buildExport() {
    var qstats = load(K_QSTAT, {}), hist = load(K_HIST, []);
    return { app: PREFIX, v: XFER_VERSION, at: Date.now(), counts: { hist: hist.length, q: Object.keys(qstats).length }, qstats: qstats, history: hist };
  }

  // 取り込み。貼り付けた文字でも、ファイルの中身でも、この関数に渡す。
  function importText(text) {
    var fail = function (msg) { return { ok: false, msg: msg }; };
    if (!storageOK) return fail("このブラウザでは記録を保存できないため、取り込めません。");
    var data;
    try { data = JSON.parse(String(text || "").replace(/^﻿/, "").trim()); }
    catch (e) { return fail("文字の形式が正しくありません。途中で切れていないか確認してください。切れる場合は、ファイルで保存・取り込みをお試しください。"); }
    if (!data || typeof data !== "object") return fail("記録の形式が違います。");
    if (data.app !== PREFIX) {
      var other = typeof data.app === "string" && data.app.indexOf("Associate") >= 0 ? "Associate" : typeof data.app === "string" && data.app.indexOf("Developer") >= 0 ? "Developer" : null;
      return fail(other ? "別の試験（" + other + "）の記録です。この画面には取り込めません。" : "記録の形式が違います。");
    }
    if (data.v !== XFER_VERSION || !data.qstats || typeof data.qstats !== "object" || !Array.isArray(data.history)) return fail("記録の形式が違います。");
    var nq = Object.keys(data.qstats).length;
    if (data.counts && (data.counts.q !== nq || data.counts.hist !== data.history.length)) {
      return fail("記録が途中で切れている可能性があります（件数が合いません）。ファイルで保存・取り込みをお試しください。");
    }
    // 取り込む前に、今の記録を1世代だけ残す
    save(K_BACKUP, { at: Date.now(), qstats: load(K_QSTAT, {}), history: load(K_HIST, []) });
    var qs = mergeQStats(load(K_QSTAT, {}), data.qstats);
    var hist = mergeHistory(load(K_HIST, []), data.history);
    save(K_QSTAT, qs);
    save(K_HIST, hist);
    return { ok: true, msg: "取り込みました。履歴 " + hist.length + "件、問題 " + Object.keys(qs).length + "問の記録を、今の記録と合わせました。" };
  }

  function restoreBackup() {
    var bk = load(K_BACKUP, null);
    if (!bk || typeof bk !== "object") return { ok: false, msg: "戻せる記録がありません。" };
    save(K_QSTAT, bk.qstats || {});
    save(K_HIST, bk.history || []);
    return { ok: true, msg: "取り込む前の記録に戻しました。" };
  }

  function downloadExport() {
    var text = JSON.stringify(buildExport(), null, 2);
    var d = new Date();
    var pad = function (x) { return (x < 10 ? "0" : "") + x; };
    var ymd = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
    var a = document.createElement("a");
    var url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    a.href = url;
    a.download = "claude-quiz-" + examKey() + "-記録-" + ymd + ".json";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
  }

  var xferNotice = null;   // 直前の操作の結果（表示したら消す）
  function copyExport(box, msg) {
    var text = JSON.stringify(buildExport());

    box.style.display = "block";

        navigator.clipboard.writeText(text).then(function () { msg.textContent = "コピーしました。貼り付け先で「貼り付け」してください。"; }, showFail);
      } else { showFail(); }
    } catch (e) { showFail(); }
  }

  function doImport(text) {
    xferNotice = importText(text);
    go("xfer");
  }

  function viewXfer() {

      ]),

    ]));

    var copyBox = h("textarea", { rows: "6", readonly: "readonly", style: "display:none;width:100%" });
    var copyMsg = h("p", { class: "small" });
    box.appendChild(h("div", { class: "card" }, [
      h("h2", { text: "ファイルに保存する（おすすめ）" }),
      h("p", { class: "small", text: "記録が多くても扱えます。" }),

      ]),
      h("h2", { text: "文字でコピーする（予備）" }),

    var pasteBox = h("textarea", { rows: "4", placeholder: "コピーした文字を、ここに貼り付け", style: "width:100%" });

      fr.readAsText(f, "utf-8");
    } });
    var importCard = h("div", { class: "card" }, [
      h("h2", { text: "保存した記録を取り込む" }),
      h("p", { class: "small", text: "別の端末で保存したファイルを、選んで取り込みます。" }),
      fileIn,
      h("h2", { text: "文字で取り込む（予備）" }),

  var MODES = [

  /*SCORE_BEGIN*/
  // 視点（軸）: nw=まだ解いていない／ms=まちがえた／sk=自信のズレ／du=復習の期限／dm=苦手な分野／wt=配点の大きい分野／rn=ランダムさ

    { nw: 2, ms: 2, sk: 2, du: 2, dm: 2, wt: 2, rn: 2 },
    { nw: 1, ms: 3, sk: 3, du: 3, dm: 2, wt: 2, rn: 2 },

  var DAY_MS = 86400000;

  function lastHist(s) { return s && s.hist && s.hist.length ? s.hist[s.hist.length - 1] : null; }
  function riskInfo(s) {

    if (lh.unk) return { add: 5, mult: 1, why: ["前回はわからなかった"] };
    if (lh.ok && lh.conf != null && lh.conf <= 1) return { add: lh.conf === 0 ? 5 : 3, mult: 1, why: ["まぐれ正解の疑い"] };

  }
  function examTimestamp() {
    if (load(K_PREFS, {}).examAdj === false || !CFG.examDate) return 0;
    var t = new Date(CFG.examDate + "T00:00:00").getTime();
    return isNaN(t) ? 0 : t;
  }
  function modeLabel(v) {
    for (var i = 0; i < MODES.length; i++) if (MODES[i].v === v) return MODES[i].t.replace(/（.*）/, "");
    return "";
  }
  function maxWeight() {
    var m = 0; Object.keys(WEIGHTS).forEach(function (k) { if (WEIGHTS[k] > m) m = WEIGHTS[k]; });
    return m;
  }
  function domainAccuracy(stats) {
    var by = {};
    ALLQ.forEach(function (q) {
      var s = stats[q.id]; if (!s) return;
      var d = by[q.domain] = by[q.domain] || { c: 0, n: 0 };
      d.c += s.c; d.n += s.n;

    var out = {};
    Object.keys(by).forEach(function (k) { out[k] = by[k].n ? by[k].c / by[k].n : null; });
    return out;
  }
  // 重みつきで、重複なしにn個を選ぶ
  function sampleWeighted(items, n) {
    var keyed = items.map(function (it) { return { it: it, k: Math.pow(Math.random(), 1 / it.w) }; });
    keyed.sort(function (a, b) { return b.k - a.k; });
    return keyed.slice(0, n).map(function (x) { return x.it; });
  }
  // 配点の比率に近づけて、分野ごとの問題数を決める（ドント方式）
  function pickBlueprint(pool, n) {
    var by = {};
    pool.forEach(function (q) { (by[q.domain] = by[q.domain] || []).push(q); });
    var doms = Object.keys(by), alloc = {};
    doms.forEach(function (d) { alloc[d] = 0; });
    for (var i = 0; i < n; i++) {
      var best = null, bv = -1;
      doms.forEach(function (d) {
        if (alloc[d] >= by[d].length) return;
        var w = WEIGHTS[d] != null ? WEIGHTS[d] : 10;
        var v = w / (alloc[d] + 1);
        if (v > bv) { bv = v; best = d; }
      });
      if (best == null) break;
      alloc[best]++;

    var out = [];
    doms.forEach(function (d) { out = out.concat(shuffle(by[d]).slice(0, alloc[d])); });
    return out;

  function chooseQuestions(pool, n, mode) {
    n = Math.min(n, pool.length);
    var stats = load(K_QSTAT, {}), reasons = {}, chosen;
    if (mode === "blueprint") {
      chosen = pickBlueprint(pool, n);
      chosen.forEach(function (q) { reasons[q.id] = ["配点に合わせた出題"]; });
    } else {
      var ctx = { axes: curAxes, dacc: domainAccuracy(stats), wmax: maxWeight(), wts: WEIGHTS, now: Date.now(), examTs: examTimestamp() };
      var items = pool.map(function (q) { var r = scoreWeight(q.domain, stats[q.id], ctx); return { q: q, w: r.w, why: r.why }; });
      chosen = sampleWeighted(items, n).map(function (p) { reasons[p.q.id] = p.why; return p.q; });
    }
    return { qs: chosen, reasons: reasons };
  }
  // 絞り込み後の問題の集まり
  function poolFor(o) {
    var stats = load(K_QSTAT, {});
    var pool = ALLQ.filter(function (q) { return !o.sets || o.sets.indexOf(q._setId) >= 0; });
    if (o.dom) pool = pool.filter(function (q) { return q.domain === o.dom; });
    if (o.scope === "retry") pool = pool.filter(function (q) { var s = stats[q.id]; return !s || s.last === false; });
    if (o.scope === "ever") pool = pool.filter(function (q) { var s = stats[q.id]; return s && s.n > s.c; });
    if (o.scope === "review") pool = pool.filter(function (q) { var s = stats[q.id]; return s && (s.last === false || riskInfo(s).add > 0); });
    return pool;

  function launch(o) {

  // 記録を見て、次の1回を提案する（ルールによる計算。AIが文章を作っているわけではない）
  function buildRecommendation(stats) {
    var total = ALLQ.length;
    var unseen = ALLQ.filter(function (q) { return !stats[q.id]; }).length;
    var lastWrong = ALLQ.filter(function (q) { var s = stats[q.id]; return s && s.last === false; }).length;
    var answeredAny = unseen < total;
    var n = Math.min(10, total), bullets = [];
    if (!answeredAny) {
      bullets.push("まだ記録がありません。まずは、おすすめの傾向で " + n + " 問、解いてみましょう。");
    } else {
      if (unseen) bullets.push("まだ解いていない問題が " + unseen + " 問（全 " + total + " 問中）あります。");
      if (lastWrong) bullets.push("前回まちがえた問題が " + lastWrong + " 問あります。早めに復習すると、定着しやすくなります。");
      var shaky = ALLQ.filter(function (q) { var s = stats[q.id]; return s && s.last !== false && riskInfo(s).add > 0; }).length;
      if (shaky) bullets.push("まぐれ正解の疑い・わからなかった問題が " + shaky + " 問あります（自信が低かった、または「わからない」を選んだ問題です）。");

      var dueN = ALLQ.filter(function (q) { var s1 = stats[q.id]; var di = s1 && dueInfo(s1, nowT, exT); return di && di.ratio >= 1; }).length;
      if (dueN) bullets.push("復習の期限が来ている問題が " + dueN + " 問あります（前回から、目安の間隔があいた問題です）。");

      Object.keys(dacc).forEach(function (d) {

      if (weak && dacc[weak] < 0.8) bullets.push("優先して強化したい分野: " + domLabel(weak) + "（これまでの正答率 " + Math.round(dacc[weak] * 100) + "%）。");
      if (!unseen && !lastWrong) bullets.push("全問を解き終え、直近の結果もすべて正解です。しばらく解いていない問題を中心に、確認しましょう。");
    }
    return { n: n, bullets: bullets };
  }

    input.addEventListener("input", function () { show(); cbs.forEach(function (f) { f(); }); });
    show();
    var el = h("div", { class: "slrow" }, [
      h("div", { class: "slhead" }, [h("span", { text: title }), cur]),

      h("div", { class: "slends" }, [h("span", { text: labels[0] }), h("span", { text: labels[labels.length - 1] })])

      el: el,
      get: function () { return parseInt(input.value, 10); },

  }

  /* ---------- 結果画面 ---------- */

  /* ---------- 「問題一覧（見るだけ）」タブ ---------- */
  var bf = { domain: "", status: "", kw: "", open: false };

    selDomain.value = bf.domain;

      opt("", "状態: すべて"), opt("unread", "未読"), opt("read", "既読"), opt("none", "未回答"), opt("ok", "前回 正解"), opt("ng", "前回 不正解"), opt("ever", "過去に1度でも不正解")

    var shownIds = {}, cur = null, cells = [], sums = [], bars = [], msgs = [];

    // ---- 目次（番号のマス。色＝未読／既読／前回正解／前回不正解。枠＝いま見ている位置） ----
    function paint() {
      var rm = qreadMap(), nRead = 0;
      cells.forEach(function (c) {
        var id = c.q.id, s = stats[id], cls = "qc";
        if (rm[id]) nRead++;

        else if (s && s.last === true) cls += " ok";

      paint();
    }
    cur = qreadMap()._last || null; if (cur && !QMAP[cur]) cur = null;
    refresh();
    // いま見ている位置を、スクロールに合わせて追いかける（画面を作り終えたあとに、監視を始める）
    setTimeout(function () {
      if (!document.body.contains(list)) return;
      var raf = 0;
      qScroll = function () {
        if (raf) return;
        raf = requestAnimationFrame(function () {
          raf = 0;
          var cs = list.children;
          for (var i = 0; i < cs.length; i++) {
            if (cs[i].getBoundingClientRect().bottom > 60) { if (cs[i].id) setCur(cs[i].id.slice(2)); break; }
          }
        });
      };
      window.addEventListener("scroll", qScroll, { passive: true });
    }, 0);
    return box;
  }

  /* ---------- 「履歴」タブ ---------- */
  function viewHistory() {
    var box = h("div");
    var list = load(K_HIST, []);
    var run0 = load(K_RUN, null);
    var card = h("div", { class: "card" });
    card.appendChild(h("h2", { text: "これまでの回答（新しい順）" }));
    if (!list.length) { card.appendChild(h("p", { text: "まだ履歴がありません。「解く」タブから始めてください。" })); box.appendChild(card); return box; }
    var t = h("table");
    t.appendChild(h("tr", null, [h("th", { text: "日時" }), h("th", { text: "状態" }), h("th", { text: "出題" }), h("th", { class: "num", text: "回答 / 全体" }), h("th", { class: "num", text: "正解" }), h("th", { class: "num", text: "正答率" }), h("th", { text: "" })]));
    list.forEach(function (e) {
      var answered = e.answered != null ? e.answered : e.total;
      var interrupted = e.status === "interrupted";
      t.appendChild(h("tr", null, [
        h("td", { text: e.at }),
        h("td", null, [h("span", { class: "badge " + (interrupted ? "warn" : "ok"), text: interrupted ? "中断" : "完了" })]),
        h("td", { class: "small", text: e.mode || "" }),
        h("td", { class: "num", text: answered + " / " + e.total }),
        h("td", { class: "num", text: e.correct + " / " + answered }),
        h("td", { class: "num", text: pct(e.correct, answered) + "%" }),
        h("td", null, [h("button", { class: "ghost small", text: "詳細", onclick: function () { historyDetail(e, run0); } })])
      ]));
    });
    card.appendChild(t);
    card.appendChild(h("p", { class: "small", text: "このブラウザに保存されています（最大50回分）。別のブラウザやパソコンには引き継がれません。" }));
    box.appendChild(card);
    return box;
  }
  function historyDetail(e, run0) {
    var content = h("div");
    var answered = e.answered != null ? e.answered : e.total;
    var interrupted = e.status === "interrupted";
    var head = h("div", { class: "card" }, [
      h("h2", { text: e.at + " の回" }),
      h("p", { text: (interrupted ? "中断（" : "完了（") + answered + " / " + e.total + " 問回答）　正解 " + e.correct + " 問（" + pct(e.correct, answered) + "%）" })
    ]);
    if (e.time) {
      var cnt = interrupted ? Math.max(1, answered) : e.total;
      head.appendChild(h("p", { class: "small", text: "時間: 回答 " + fmtSec(e.time.a) + "（目標 " + fmtSec(e.time.ta * cnt) + "）／ 解説 " + fmtSec(e.time.r) + "（目標 " + fmtSec(e.time.tr * cnt) + "）" }));
    }
    var row = h("div", { class: "row" });
    row.appendChild(h("button", { class: "ghost", text: "← 履歴に戻る", onclick: function () { go("history"); } }));
    if (interrupted && validRun(run0) && run0.id === e.id && run0.results.length < run0.order.length) {
      row.appendChild(h("button", { text: "この回を続きから再開", onclick: function () { run = run0; renderQuestion(); } }));
    }
    var misses = (e.details || []).filter(function (d) { return !d.ok && QMAP[d.q]; });
    if (misses.length) row.appendChild(h("button", { class: "ghost", text: "この回でまちがえた問題だけ再挑戦", onclick: function () {
      startRun(misses.map(function (d) { return QMAP[d.q]; }), true, true);
    } }));
    head.appendChild(row);
    content.appendChild(head);
    if (!e.details) {
      content.appendChild(h("div", { class: "card", text: "この回は、問題ごとの記録がない旧形式です（点数のみ）。" }));
    } else {
      e.details.forEach(function (d) {
        if (QMAP[d.q]) content.appendChild(questionBlock(QMAP[d.q], { sel: d.sel, ok: d.ok }));
      });
    }
    shell("history", content);
  }

  /* ---------- 「問題別成績」タブ ---------- */
  var sortMode = "order";
  function viewStats() {
    var box = h("div");
    var stats = load(K_QSTAT, {});
    var dcard = h("div", { class: "card" });
    dcard.appendChild(h("h2", { text: "分野ごとの成績（これまでの累計）" }));
    var dt = h("table");
    dt.appendChild(h("tr", null, [h("th", { text: "分野" }), h("th", { class: "num", text: "問題数" }), h("th", { class: "num", text: "回答済み" }), h("th", { class: "num", text: "前回正解" }), h("th", { class: "num", text: "累計正答率" })]));
    DOMAINS.forEach(function (d) {
      var qs = ALLQ.filter(function (q) { return q.domain === d; });
      var seen = 0, lastOk = 0, sn = 0, sc = 0;
      qs.forEach(function (q) { var s = stats[q.id]; if (s) { seen++; if (s.last) lastOk++; sn += s.n; sc += s.c; } });
      dt.appendChild(h("tr", null, [
        h("td", { text: domLabel(d) }),
        h("td", { class: "num", text: String(qs.length) }),
        h("td", { class: "num", text: seen + " / " + qs.length }),
        h("td", { class: "num", text: lastOk + " / " + qs.length }),
        h("td", { class: "num", text: sn ? pct(sc, sn) + "%" : "—" })
      ]));
    });
    dcard.appendChild(dt);
    dcard.appendChild(h("p", { class: "small", text: "「前回正解」は、各問題の直近の回答が正解だった問題の数です。配点は、公式の試験ガイドにもとづく目安です。" }));
    box.appendChild(dcard);
    var card = h("div", { class: "card" });
    card.appendChild(h("h2", { text: "問題ごとの成績" }));
    var sorts = [{ v: "order", t: "出題順" }, { v: "rate", t: "正答率が低い順" }, { v: "wrong", t: "まちがえた回数が多い順" }];
    var ctl = h("div", { class: "controls" });
    sorts.forEach(function (s) {
      ctl.appendChild(h("button", { class: "tab small" + (sortMode === s.v ? " active" : ""), text: s.t, onclick: function () { sortMode = s.v; go("stats"); } }));
    });
    card.appendChild(ctl);
    var items = ALLQ.slice();
    function rate(q) { var s = stats[q.id]; return s ? s.c / s.n : 2; }
    function wrong(q) { var s = stats[q.id]; return s ? s.n - s.c : -1; }
    if (sortMode === "rate") items.sort(function (a, b) { return rate(a) - rate(b); });
    if (sortMode === "wrong") items.sort(function (a, b) { return wrong(b) - wrong(a); });
    var t = h("table");
    t.appendChild(h("tr", null, [h("th", { text: "問題" }), h("th", { class: "num", text: "挑戦" }), h("th", { class: "num", text: "正解" }), h("th", { class: "num", text: "正答率" }), h("th", { text: "前回" })]));
    items.forEach(function (q) {
      var s = stats[q.id];
      var short = q.q.length > 44 ? q.q.slice(0, 44) + "…" : q.q;
      t.appendChild(h("tr", { class: "click", onclick: function () { questionDetail(q); } }, [
        h("td", null, [h("div", { text: short }), h("div", { class: "small", text: "No." + q._no + " ／ " + q.id + " ／ " + q.domain })]),
        h("td", { class: "num", text: s ? String(s.n) : "—" }),
        h("td", { class: "num", text: s ? String(s.c) : "—" }),
        h("td", { class: "num", text: s ? pct(s.c, s.n) + "%" : "—" }),
        h("td", { text: s ? (s.last ? "○" : "×") : "未" })
      ]));
    });
    card.appendChild(t);
    card.appendChild(h("p", { class: "small", text: "行をクリックすると、その問題の詳しい履歴と解説が見られます。" }));
    box.appendChild(card);
    return box;
  }
  function questionDetail(q) {
    var stats = load(K_QSTAT, {});
    var s = stats[q.id];
    var content = h("div");
    content.appendChild(h("div", { class: "row", style: "margin:0 0 12px" }, [h("button", { class: "ghost", text: "← 問題別成績に戻る", onclick: function () { go("stats"); } })]));
    content.appendChild(questionBlock(q, { open: true, stat: s }));
    var hc = h("div", { class: "card" }, [h("h2", { text: "この問題の回答履歴（古い順）" })]);
    if (!s) hc.appendChild(h("p", { text: "まだ回答していません。" }));
    else {
      var tl = h("div", { class: "timeline" });
      s.hist.forEach(function (x) { tl.appendChild(h("span", { class: "badge " + (x.ok ? "ok" : "ng"), text: fmt(x.ts) + " " + (x.ok ? "○" : "×") })); });
      hc.appendChild(tl);
    }
    content.appendChild(hc);
    shell("stats", content);
  }

  // 初めて開いた人（記録も、途中の回もない）は、教科書から。ふだんの人は、これまでどおり「解く」から
  var firstVisit = !Object.keys(load(K_QSTAT, {})).length && !load(K_RUN, null);
  go(TB.length && firstVisit ? "book" : "solve");
  syncSoon(300);   // 開いたときに、サーバーの記録を、取り込む
  document.addEventListener("visibilitychange", function () { if (!document.hidden) syncSoon(500); });   // 別の端末から戻ったときにも
})();
</script>
</body>
</html>
