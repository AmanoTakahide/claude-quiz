<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Claude 練習問題</title>
<style>
:root{--bg:#f6f4ef;--fg:#1f2937;--muted:#6b7280;--card:#fff;--line:#e5e1d8;--a:#c2410c;--b:#1d4ed8}
@media (prefers-color-scheme:dark){:root{--bg:#16181d;--fg:#f3f4f6;--muted:#9ca3af;--card:#1f232b;--line:#343944;--a:#fb923c;--b:#93c5fd}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:32px 16px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 24px;font-size:.9rem}
.grid{display:grid;gap:14px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:18px 18px 16px;text-decoration:none;color:inherit}
a.card:hover{box-shadow:0 2px 10px rgba(0,0,0,.12)}
a.card h2{margin:0 0 4px;font-size:1.15rem;color:var(--c)}
a.card p{margin:0;color:var(--muted);font-size:.9rem}
.tag{display:inline-block;margin-top:8px;font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
footer{margin-top:28px;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<main>
  <h1>Claude 練習問題</h1>
  <p class="sub">受ける試験を選んでください。成績の記録は、試験ごとに、この端末のブラウザに別々に保存されます。</p>
  <div class="grid">
    <a class="card" style="--c:var(--a)" href="associate/">
      <h2>Associate – Foundations</h2>
      <p>7分野の練習問題。問題数・出題の重みづけ・タイマーを選べます。</p>
      <span class="tag">11/25 受験予定</span>
    </a>
    <a class="card" style="--c:var(--b)" href="developer/">
      <h2>Developer – Foundations</h2>
      <p>8分野の練習問題（準備コース講座2〜5の内容を含む）。複数選択にも対応。</p>
      <span class="tag">11/26 受験予定</span>
    </a>
  </div>
  <footer>自作の練習問題です。公式の試験問題ではありません。</footer>
</main>
</body>
</html>
