<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>練習問題</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #2b2a28; --muted: #6b6760;
    --line: #e3ded6; --accent: #c4623f; --accent-weak: #f6e3db;
    --ok: #2f7d4f; --ok-bg: #e2f1e8; --ng: #b3392e; --ng-bg: #f9e1de; --warn: #a86b00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1c1a; --card: #272624; --text: #ece8e1; --muted: #a39e94;
      --line: #3a3835; --accent: #e08462; --accent-weak: #3b2a24;
      --ok: #7cc79a; --ok-bg: #213529; --ng: #f08a80; --ng-bg: #3a2422; --warn: #e0b04a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif; line-height: 1.7; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 20px 0 8px; }
  .sub { color: var(--muted); font-size: .9rem; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
  .card h2:first-child { margin-top: 0; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; font-size: .8rem; }
  .tag { background: var(--accent-weak); color: var(--accent); padding: 2px 10px; border-radius: 999px; }
  .tag.plain { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .badge { font-size: .78rem; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  .badge.ng { color: var(--ng); border-color: var(--ng); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .qtext { font-size: 1.05rem; margin: 0 0 14px; white-space: pre-wrap; }
  .hint { color: var(--muted); font-size: .85rem; margin: -6px 0 12px; }
  label.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  label.opt:hover { border-color: var(--accent); }
  label.opt input { margin-top: 6px; }
  label.opt.correct { background: var(--ok-bg); border-color: var(--ok); }
  label.opt.wrong { background: var(--ng-bg); border-color: var(--ng); }
  label.opt.locked { cursor: default; }
  .mark { margin-left: auto; font-weight: 700; white-space: nowrap; padding-left: 8px; }
  .mark.ok { color: var(--ok); } .mark.ng { color: var(--ng); }
  .optrow { display: flex; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; margin-bottom: 6px; font-size: .95rem; }
  .optrow.correct { background: var(--ok-bg); border-color: var(--ok); }
  .optrow.wrong { background: var(--ng-bg); border-color: var(--ng); }
  button { font: inherit; border: 0; border-radius: 10px; padding: 10px 20px; cursor: pointer;
    background: var(--accent); color: #fff; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.small { padding: 4px 12px; font-size: .88rem; }
  /* 次の画面に進む、メインのボタン（回答する・次の問題へ・結果を見る） */
  button.primary { font-weight: 700; padding: 12px 28px; box-shadow: 0 2px 6px rgba(196, 98, 63, .35); }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .tab { background: transparent; color: var(--text); border: 1px solid var(--line); padding: 8px 14px; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
  .progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 12px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .result-head { font-size: 1.1rem; font-weight: 700; }
  .explain { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--accent-weak); white-space: pre-wrap; }
  .explain .src { display: block; margin-top: 8px; color: var(--muted); font-size: .82rem; }
  .basics { margin-top: 12px; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line);
    border-left: 4px solid var(--accent); background: var(--card); white-space: pre-wrap; }
  .basics .bt { display: block; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
  .verdict { font-weight: 700; margin: 12px 0 0; }
  .verdict.ok { color: var(--ok); } .verdict.ng { color: var(--ng); }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.click { cursor: pointer; }
  tr.click:hover { background: var(--accent-weak); }
  .bar { height: 8px; background: var(--line); border-radius: 999px; min-width: 80px; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 999px; }
  .small { font-size: .85rem; color: var(--muted); }
  .check { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  select, input[type=text] { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
  details.more > summary { cursor: pointer; color: var(--accent); margin-top: 8px; }
  .banner { background: var(--ng-bg); color: var(--ng); padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; }
  .notice { background: var(--accent-weak); padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; }
  .timeline { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  input[type=number] { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); width: 90px; }
  /* タイマー（出題画面の上に貼りついて、スクロールしても見える） */
  .timer { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 6px 0 8px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
  .trow { display: grid; grid-template-columns: 7.5em 1fr 11em; gap: 10px; align-items: center; padding: 3px 8px; border-radius: 8px; border: 1px solid transparent; opacity: .55; }
  .trow.active { opacity: 1; border-color: var(--line); background: var(--card); }
  .trow.over { border-color: var(--ng); }
  .tname { font-size: .85rem; font-weight: 700; }
  .tgauge { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .tgauge > div { height: 100%; background: var(--ok); border-radius: 999px; transition: width .4s linear; }
  .tgauge > div.warn { background: var(--warn); }
  .tgauge > div.over { background: var(--ng); }
  .ttext { font-size: .82rem; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ttext.over { color: var(--ng); font-weight: 700; }
  .tsub { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .8rem; color: var(--muted); padding: 2px 8px 0; }
  @media (max-width: 560px) { .trow { grid-template-columns: 5.5em 1fr; } .ttext { grid-column: 1 / -1; text-align: left; } }
</style>
</head>
<body>
<main id="app"></main>

<!-- 設定と問題データ（tools/build_data.py が、config.json と data/sets/*.json から自動生成します） -->
<script src="data/questions.bundle.js"></script>

<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var SETS = window.QUESTION_SETS || [];
  var QMAP = {}, ALLQ = [], DOMAINS = [];
  SETS.forEach(function (set) {
    set.questions.forEach(function (q) { q._set = set.title; q._setId = set.id; QMAP[q.id] = q; ALLQ.push(q); });
  });
  ALLQ.forEach(function (q) { if (DOMAINS.indexOf(q.domain) < 0) DOMAINS.push(q.domain); });

  // 設定（config.json の内容）。タイトル、保存キーの接頭辞、分野と配点
  var CFG = window.QUIZ_CONFIG || {};
  var WEIGHTS = {}, ORDER = [];
  (CFG.domains || []).forEach(function (d) { WEIGHTS[d.name] = d.weight; ORDER.push(d.name); });
  DOMAINS.sort(function (a, b) {
    var ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
    return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
  });
  function domLabel(n) { return WEIGHTS[n] != null ? n + "（配点" + WEIGHTS[n] + "%）" : n; }
  if (CFG.title) document.title = CFG.title;

  // 保存キー（接頭辞は config.json の storagePrefix）。Associateは旧バージョンと同じ接頭辞なので、履歴が引き継がれます
  var PREFIX = CFG.storagePrefix || "quiz";
  var K_HIST = PREFIX + "History";
  var K_QSTAT = PREFIX + "QStats";
  var K_RUN = PREFIX + "InProgress";
  var K_PREFS = PREFIX + "Prefs";
  var K_TIMER = PREFIX + "Timer";
  var storageOK = true;
  function load(key, def) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { storageOK = false; return def; }
  }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { storageOK = false; } }
  function remove(key) { try { localStorage.removeItem(key); } catch (e) { storageOK = false; } }
  try { localStorage.setItem("_t", "1"); localStorage.removeItem("_t"); } catch (e) { storageOK = false; }

  var run = null;      // 解いている最中の回
  var tab = "solve";

  /* ---------- 共通の部品 ---------- */
  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "class") el.className = attrs[k];
      else if (k === "text") el.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (c == null) return;
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return el;
  }
  function clear() { stopTick(); while (app.firstChild) app.removeChild(app.firstChild); }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(n, d) { return d ? Math.round((n / d) * 100) : 0; }
  function pad(n) { return ("0" + n).slice(-2); }
  function fmt(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function optById(q, id) { return q.options.filter(function (o) { return o.id === id; })[0]; }
  function optLines(q, ids) {
    return ids.map(function (id) { var o = optById(q, id); return "・" + (o ? o.t : id); }).join("\n");
  }
  function basicsBlock(q) {
    return h("div", { class: "basics" }, [
      h("span", { class: "bt", text: "基礎からの解説（初心者向け）" }),
      document.createTextNode(q.basics || "")
    ]);
  }
  function explainBlock(q) {
    return h("div", { class: "explain" }, [
      document.createTextNode(q.explain),
      h("span", { class: "src", text: "出典（講座）: " + q.src })
    ]);
  }
  function statBadge(s) {
    if (!s) return h("span", { class: "badge", text: "未回答" });
    return h("span", { class: "badge " + (s.last ? "ok" : "ng"), text: "前回 " + (s.last ? "○" : "×") + "　正解 " + s.c + "/" + s.n });
  }

  /* ---------- タイマー ----------
     目標時間は「1問あたりの秒数」で持ち、回の問題数をかけて、全体の目標にします。
     「回答する前」と「回答したあと（解説を読む時間）」を、別々に数えます。
     目標を過ぎても止めません（ゲージが赤くなり、超過時間が出ます）。 */
  var TIMER_DEFAULT = { on: true, ans: 90, rev: 120 };
  (function () {
    var t = CFG.timer || {};
    if (t.answerSec) TIMER_DEFAULT.ans = t.answerSec;
    if (t.reviewSec) TIMER_DEFAULT.rev = t.reviewSec;
    if (t.enabled === false) TIMER_DEFAULT.on = false;
  })();
  function clampSec(v, def) {
    v = parseInt(v, 10);
    if (isNaN(v)) return def;
    return Math.max(5, Math.min(1800, v));
  }
  function loadTimer() {
    var t = load(K_TIMER, null) || {};
    return {
      on: t.on == null ? TIMER_DEFAULT.on : !!t.on,
      ans: clampSec(t.ans, TIMER_DEFAULT.ans),
      rev: clampSec(t.rev, TIMER_DEFAULT.rev)
    };
  }
  function fmtSec(s) {
    s = Math.max(0, Math.round(s));
    return Math.floor(s / 60) + ":" + pad(s % 60);
  }
  function fmtMin(s) {
    s = Math.round(s);
    var m = Math.floor(s / 60), r = s % 60;
    return m ? (r ? m + "分" + r + "秒" : m + "分") : r + "秒";
  }
  function timerOn(r) { return !!(r && r.timer && r.timer.on && r.t); }
  // 回答済みの問題だけの合計時間（途中で止めた、解いている最中の問題は含めない）
  function sumTimes(r) {
    var a = 0, v = 0;
    r.results.forEach(function (x) { a += x.ta || 0; v += x.tr || 0; });
    return { a: a, r: v };
  }

  var tickH = null, tickLast = 0, tickUI = null, tickSaved = 0, phase = "ans", paused = false;
  function flushTick() {
    if (!tickH || !timerOn(run)) return;
    var now = Date.now(), d = (now - tickLast) / 1000;
    tickLast = now;
    if (paused || document.hidden) return;   // 一時停止中・別のタブを見ている間は数えない
    if (d > 5) d = 5;                        // パソコンのスリープなどで、一気に増えるのを防ぐ
    if (phase === "ans") {
      run.t.a += d;
      if (run.cur) run.cur.a += d;
    } else {
      run.t.r += d;
      var lr = run.results[run.results.length - 1];
      if (lr) lr.tr = (lr.tr || 0) + d;
    }
  }
  function stopTick() {
    flushTick();
    if (tickH) { clearInterval(tickH); tickH = null; }
    tickUI = null;
  }
  function startTick(ui) {
    if (!timerOn(run)) return;
    tickUI = ui; tickLast = Date.now(); tickSaved = tickLast;
    ui.update();
    tickH = setInterval(function () {
      flushTick();
      if (tickUI) tickUI.update();
      if (Date.now() - tickSaved > 5000) { tickSaved = Date.now(); save(K_RUN, run); }
    }, 500);
  }
  // 出題画面の上に貼りつく、残り時間のゲージ
  function timerPanel() {
    var T = run.timer, n = run.order.length;
    var rows = [
      { k: "a", name: "回答の残り", used: function () { return run.t.a; }, bud: T.ans * n },
      { k: "r", name: "解説の残り", used: function () { return run.t.r; }, bud: T.rev * n }
    ];
    var box = h("div", { class: "timer" });
    rows.forEach(function (r) {
      r.fill = h("div", { style: "width:100%" });
      r.txt = h("span", { class: "ttext" });
      r.el = h("div", { class: "trow" }, [h("span", { class: "tname", text: r.name }), h("div", { class: "tgauge" }, [r.fill]), r.txt]);
      box.appendChild(r.el);
    });
    var cur = h("span");
    var pauseBtn = h("button", { class: "ghost small", text: "一時停止", onclick: function () {
      paused = !paused;
      pauseBtn.textContent = paused ? "再開する" : "一時停止";
      update();
    } });
    // 一時停止中に、選択肢を押す・回答するなどの操作をしたら、自動で再開する
    function resume() {
      if (!paused) return;
      paused = false;
      pauseBtn.textContent = "一時停止";
      update();
    }
    box.appendChild(h("div", { class: "tsub" }, [cur, pauseBtn]));
    function update() {
      rows.forEach(function (r) {
        var used = r.used(), rem = r.bud - used, frac = Math.max(0, rem / r.bud);
        r.fill.style.width = (frac * 100) + "%";
        r.fill.className = rem <= 0 ? "over" : frac <= 0.25 ? "warn" : "";
        r.el.className = "trow" + (r.k === (phase === "ans" ? "a" : "r") ? " active" : "") + (rem <= 0 ? " over" : "");
        r.txt.className = "ttext" + (rem <= 0 ? " over" : "");
        r.txt.textContent = (rem <= 0 ? "超過 +" + fmtSec(-rem) : "残り " + fmtSec(rem)) + "（" + fmtSec(used) + " / " + fmtSec(r.bud) + "）";
      });
      var q = phase === "ans" ? (run.cur ? run.cur.a : 0) : (run.results.length ? (run.results[run.results.length - 1].tr || 0) : 0);
      cur.textContent = (paused ? "一時停止中　" : "") + "この問題の" + (phase === "ans" ? "回答" : "解説") + ": " + fmtSec(q) + "（1問の目安 " + fmtSec(phase === "ans" ? T.ans : T.rev) + "）";
    }
    return { el: box, update: update, resume: resume };
  }
  // 結果画面の「時間」カード
  function timeCard(r, finished) {
    if (!timerOn(r)) return null;
    var T = r.timer, n = r.order.length, cnt = finished ? n : Math.max(1, r.results.length);
    var card = h("div", { class: "card" });
    card.appendChild(h("h2", { text: "時間" }));
    var t = h("table");
    t.appendChild(h("tr", null, [h("th", { text: "" }), h("th", { class: "num", text: "かかった時間" }), h("th", { class: "num", text: "目標" }), h("th", { class: "num", text: "差" })]));
    var sm = sumTimes(r);
    [["回答", sm.a, T.ans * cnt], ["解説を読む", sm.r, T.rev * cnt]].forEach(function (x) {
      var diff = x[1] - x[2];
      t.appendChild(h("tr", null, [
        h("td", { text: x[0] }),
        h("td", { class: "num", text: fmtSec(x[1]) }),
        h("td", { class: "num", text: fmtSec(x[2]) }),
        h("td", { class: "num", text: (diff > 0 ? "+" : "−") + fmtSec(Math.abs(diff)) + (diff > 0 ? "（超過）" : "（余り）") })
      ]));
    });
    card.appendChild(t);
    var ans = r.results.length;
    if (ans) card.appendChild(h("p", { class: "small", text: "1問あたりの平均: 回答 " + fmtSec(sm.a / ans) + "（目標 " + fmtSec(T.ans) + "）、解説 " + fmtSec(sm.r / ans) + "（目標 " + fmtSec(T.rev) + "）" + (finished ? "" : "。中断した回は、回答した " + ans + " 問分の目標と比べています。") }));
    var slow = r.results.filter(function (x) { return x.ta != null; }).sort(function (a, b) { return b.ta - a.ta; }).slice(0, 3);
    if (slow.length) card.appendChild(h("p", { class: "small", text: "回答に時間がかかった問題: " + slow.map(function (x) { return x.qid + "（" + fmtSec(x.ta) + "）"; }).join("、") }));
    return card;
  }

  /* ---------- 記録（履歴・問題別成績） ---------- */
  function recordAnswer(qid, ok) {
    var all = load(K_QSTAT, {});
    var s = all[qid] || { n: 0, c: 0, last: null, lastAt: null, hist: [] };
    s.n++; if (ok) s.c++;
    s.last = ok; s.lastAt = Date.now();
    s.hist.push({ ts: s.lastAt, ok: ok });
    if (s.hist.length > 30) s.hist = s.hist.slice(-30);
    all[qid] = s;
    save(K_QSTAT, all);
  }
  function upsertHistory(r, status) {
    var list = load(K_HIST, []);
    var entry = {
      id: r.id, ts: r.id, at: fmt(r.id), status: status, mode: r.mode || "",
      total: r.order.length, answered: r.results.length,
      correct: r.results.filter(function (x) { return x.ok; }).length,
      details: r.results.map(function (x) { return { q: x.qid, ok: x.ok, sel: x.sel, ta: x.ta != null ? Math.round(x.ta) : null, tr: x.tr != null ? Math.round(x.tr) : null }; }),
      time: timerOn(r) ? { a: Math.round(sumTimes(r).a), r: Math.round(sumTimes(r).r), ta: r.timer.ans, tr: r.timer.rev } : null
    };
    var found = -1;
    for (var i = 0; i < list.length; i++) if (list[i].id === r.id) { found = i; break; }
    if (found >= 0) list[found] = entry; else list.unshift(entry);
    save(K_HIST, list.slice(0, 50));
  }
  function validRun(r) {
    return r && Array.isArray(r.order) && Array.isArray(r.results) && r.order.length > 0 &&
      r.order.every(function (id) { return QMAP[id]; });
  }

  /* ---------- 画面の枠（タブ） ---------- */
  var TABS = [
    { id: "solve", label: "解く" },
    { id: "browse", label: "問題一覧（見るだけ）" },
    { id: "history", label: "履歴" },
    { id: "stats", label: "問題別成績" }
  ];
  function shell(active, content) {
    clear();
    app.appendChild(h("h1", { text: CFG.title || "練習問題" }));
    app.appendChild(h("div", { class: "sub", text: CFG.subtitle || "" }));
    if (!storageOK) app.appendChild(h("div", { class: "banner", text: "このブラウザでは結果を保存できません（プライベートモードや、保存の制限が原因のことがあります）。履歴は残りません。" }));
    var nav = h("div", { class: "tabs" });
    TABS.forEach(function (t) {
      nav.appendChild(h("button", { class: "tab" + (t.id === active ? " active" : ""), text: t.label, onclick: function () { go(t.id); } }));
    });
    app.appendChild(nav);
    app.appendChild(content);
  }
  function go(t) {
    tab = t;
    var c = t === "solve" ? viewSolve() : t === "browse" ? viewBrowse() : t === "history" ? viewHistory() : viewStats();
    shell(t, c);
  }

  /* ---------- 問題カード（見る用） ---------- */
  // o: { sel: 選んだ選択肢のid配列, open: 解説を最初から開く, stat: 成績 }
  function questionBlock(q, o) {
    o = o || {};
    var card = h("div", { class: "card" });
    var tags = h("div", { class: "tags" }, [
      h("span", { class: "tag", text: q.domain }),
      h("span", { class: "tag plain", text: q.id })
    ]);
    if (o.stat !== undefined) tags.appendChild(statBadge(o.stat));
    if (o.sel) tags.appendChild(h("span", { class: "badge " + (o.ok ? "ok" : "ng"), text: o.ok ? "この回: 正解" : "この回: 不正解" }));
    card.appendChild(tags);
    card.appendChild(h("p", { class: "qtext", text: q.q }));
    if (q.type === "multi") card.appendChild(h("p", { class: "hint", text: "※ " + q.pick + "つ選ぶ問題" }));
    q.options.forEach(function (op) {
      var cls = "optrow";
      var label = "";
      if (o.sel) {
        var isAns = q.answer.indexOf(op.id) >= 0, isSel = o.sel.indexOf(op.id) >= 0;
        if (isAns) { cls += " correct"; label = isSel ? "　← 正解（あなたも選択）" : "　← 正解"; }
        else if (isSel) { cls += " wrong"; label = "　← あなたの選択（不正解）"; }
      }
      card.appendChild(h("div", { class: cls, text: op.t + label }));
    });
    var body = h("div", null, [
      h("p", { class: "small", style: "white-space:pre-wrap;margin:8px 0 0", text: "正解:\n" + optLines(q, q.answer) }),
      explainBlock(q),
      q.basics ? basicsBlock(q) : null
    ]);
    var det = h("details", { class: "more" }, [h("summary", { text: "答えと解説を見る" }), body]);
    if (o.open) det.open = true;
    card.appendChild(det);
    return card;
  }

  /* ---------- 出題の重みづけ（おすすめ） ---------- */
  var MODES = [
    { v: "smart", t: "おすすめ（記録から自動で調整）", d: "未回答、まちがえた問題、苦手な分野、しばらく解いていない問題を、バランスよく選びます。" },
    { v: "random", t: "ランダム（どれも同じ確率）", d: "記録に関係なく、完全にランダムに選びます。" },
    { v: "unseen", t: "未回答を優先", d: "まだ解いていない問題を、優先して選びます。" },
    { v: "wrong", t: "まちがえた問題を優先", d: "前回まちがえた問題、過去にまちがえた問題を、優先して選びます。" },
    { v: "blueprint", t: "本番の配点に合わせる", d: "公式の配点の割合に近くなるように、分野ごとの問題数を決めます（模擬試験の練習向け）。" }
  ];
  function modeLabel(v) {
    for (var i = 0; i < MODES.length; i++) if (MODES[i].v === v) return MODES[i].t.replace(/（.*）/, "");
    return "";
  }
  function maxWeight() {
    var m = 0; Object.keys(WEIGHTS).forEach(function (k) { if (WEIGHTS[k] > m) m = WEIGHTS[k]; });
    return m;
  }
  function domainAccuracy(stats) {
    var by = {};
    ALLQ.forEach(function (q) {
      var s = stats[q.id]; if (!s) return;
      var d = by[q.domain] = by[q.domain] || { c: 0, n: 0 };
      d.c += s.c; d.n += s.n;
    });
    var out = {};
    Object.keys(by).forEach(function (k) { out[k] = by[k].n ? by[k].c / by[k].n : null; });
    return out;
  }
  // 1問ごとの「選ばれやすさ（重み）」と、その理由
  function weightOf(q, mode, stats, dacc, wmax) {
    var s = stats[q.id], DAY = 86400000;
    if (mode === "random") return { w: 1, why: ["ランダム"] };
    if (mode === "unseen") return s ? { w: 1, why: [] } : { w: 8, why: ["未回答"] };
    if (mode === "wrong") {
      if (!s) return { w: 1.5, why: ["未回答"] };
      if (s.last === false) return { w: 8, why: ["前回まちがえた"] };
      if (s.n > s.c) return { w: 4, why: ["過去にまちがえた"] };
      return { w: 1, why: [] };
    }
    // おすすめ（smart）
    var w = 1, why = [];
    if (!s) { w += 4; why.push("未回答"); }
    else {
      if (s.last === false) { w += 5; why.push("前回まちがえた"); }
      else if (s.n > s.c) { w += 2; why.push("過去にまちがえた"); }
      var acc = s.c / s.n;
      if (acc < 0.6) { w += (1 - acc) * 3; if (why.indexOf("前回まちがえた") < 0) why.push("正答率が低い"); }
      var days = (Date.now() - s.lastAt) / DAY;
      if (s.last === true) {
        if (days < 1) w *= 0.3;                       // さっき正解した問題は、少し後回し
        else if (days >= 3) { w += 1; why.push("しばらく解いていない"); }
      }
    }
    if (WEIGHTS[q.domain] != null && wmax) {
      w *= 0.7 + 0.6 * WEIGHTS[q.domain] / wmax;       // 配点の大きい分野を、やや多めに
      if (WEIGHTS[q.domain] >= wmax * 0.75) why.push("配点が大きい分野");
    }
    var da = dacc[q.domain];
    if (da != null) {
      w *= 1 + (1 - da) * 0.8;                         // 苦手な分野を、やや多めに
      if (da < 0.5) why.push("苦手な分野");
    }
    return { w: Math.max(w, 0.05), why: why };
  }
  // 重みつきで、重複なしにn個を選ぶ
  function sampleWeighted(items, n) {
    var keyed = items.map(function (it) { return { it: it, k: Math.pow(Math.random(), 1 / it.w) }; });
    keyed.sort(function (a, b) { return b.k - a.k; });
    return keyed.slice(0, n).map(function (x) { return x.it; });
  }
  // 配点の比率に近づけて、分野ごとの問題数を決める（ドント方式）
  function pickBlueprint(pool, n) {
    var by = {};
    pool.forEach(function (q) { (by[q.domain] = by[q.domain] || []).push(q); });
    var doms = Object.keys(by), alloc = {};
    doms.forEach(function (d) { alloc[d] = 0; });
    for (var i = 0; i < n; i++) {
      var best = null, bv = -1;
      doms.forEach(function (d) {
        if (alloc[d] >= by[d].length) return;
        var w = WEIGHTS[d] != null ? WEIGHTS[d] : 10;
        var v = w / (alloc[d] + 1);
        if (v > bv) { bv = v; best = d; }
      });
      if (best == null) break;
      alloc[best]++;
    }
    var out = [];
    doms.forEach(function (d) { out = out.concat(shuffle(by[d]).slice(0, alloc[d])); });
    return out;
  }
  function chooseQuestions(pool, n, mode) {
    n = Math.min(n, pool.length);
    var stats = load(K_QSTAT, {}), reasons = {}, chosen;
    if (mode === "blueprint") {
      chosen = pickBlueprint(pool, n);
      chosen.forEach(function (q) { reasons[q.id] = ["配点に合わせた出題"]; });
    } else {
      var dacc = domainAccuracy(stats), wmax = maxWeight();
      var items = pool.map(function (q) { var r = weightOf(q, mode, stats, dacc, wmax); return { q: q, w: r.w, why: r.why }; });
      chosen = sampleWeighted(items, n).map(function (p) { reasons[p.q.id] = p.why; return p.q; });
    }
    return { qs: chosen, reasons: reasons };
  }
  // 絞り込み後の問題の集まり
  function poolFor(o) {
    var stats = load(K_QSTAT, {});
    var pool = ALLQ.filter(function (q) { return !o.sets || o.sets.indexOf(q._setId) >= 0; });
    if (o.dom) pool = pool.filter(function (q) { return q.domain === o.dom; });
    if (o.scope === "retry") pool = pool.filter(function (q) { var s = stats[q.id]; return !s || s.last === false; });
    if (o.scope === "ever") pool = pool.filter(function (q) { var s = stats[q.id]; return s && s.n > s.c; });
    return pool;
  }
  function launch(o) {
    var pool = poolFor(o);
    if (!pool.length) { alert("該当する問題がありません。条件を変えてください。"); return; }
    var n = !o.n ? pool.length : Math.min(o.n, pool.length);
    var pick = chooseQuestions(pool, n, o.mode);
    beginRun(pick.qs, o.sq, o.so, pick.reasons, modeLabel(o.mode));
  }
  // 記録を見て、次の1回を提案する（ルールによる計算。AIが文章を作っているわけではない）
  function buildRecommendation(stats) {
    var total = ALLQ.length;
    var unseen = ALLQ.filter(function (q) { return !stats[q.id]; }).length;
    var lastWrong = ALLQ.filter(function (q) { var s = stats[q.id]; return s && s.last === false; }).length;
    var answeredAny = unseen < total;
    var n = Math.min(10, total), bullets = [];
    if (!answeredAny) {
      bullets.push("まだ記録がありません。まずは、おすすめの傾向で " + n + " 問、解いてみましょう。");
    } else {
      if (unseen) bullets.push("まだ解いていない問題が " + unseen + " 問（全 " + total + " 問中）あります。");
      if (lastWrong) bullets.push("前回まちがえた問題が " + lastWrong + " 問あります。早めに復習すると、定着しやすくなります。");
      var dacc = domainAccuracy(stats), wmax = maxWeight(), weak = null, wp = 0;
      Object.keys(dacc).forEach(function (d) {
        if (dacc[d] == null) return;
        var p = (1 - dacc[d]) * (WEIGHTS[d] != null ? WEIGHTS[d] : 10);   // 苦手さ × 配点
        if (p > wp) { wp = p; weak = d; }
      });
      if (weak && dacc[weak] < 0.8) bullets.push("優先して強化したい分野: " + domLabel(weak) + "（これまでの正答率 " + Math.round(dacc[weak] * 100) + "%）。");
      if (!unseen && !lastWrong) bullets.push("全問を解き終え、直近の結果もすべて正解です。しばらく解いていない問題を中心に、確認しましょう。");
    }
    return { n: n, bullets: bullets };
  }

  /* ---------- 「解く」タブ ---------- */
  function viewSolve() {
    var box = h("div");
    var stats = load(K_QSTAT, {});
    var prefs = load(K_PREFS, {});
    var saved = load(K_RUN, null);
    if (validRun(saved) && saved.results.length < saved.order.length) {
      var c = saved.results.filter(function (x) { return x.ok; }).length;
      box.appendChild(h("div", { class: "card" }, [
        h("h2", { text: "中断した回があります" }),
        h("p", { text: fmt(saved.id) + " に開始 ／ " + saved.results.length + " / " + saved.order.length + " 問回答済み（正解 " + c + "）" }),
        h("div", { class: "row" }, [
          h("button", { text: "続きから再開", onclick: function () { run = saved; renderQuestion(); } }),
          h("button", { class: "ghost", text: "この回を破棄（履歴には残ります）", onclick: function () { remove(K_RUN); go("solve"); } })
        ])
      ]));
    }

    // 今日のおすすめ
    var rec = buildRecommendation(stats);
    var rc = h("div", { class: "card" });
    rc.appendChild(h("h2", { text: "今日のおすすめ" }));
    rec.bullets.forEach(function (b) { rc.appendChild(h("div", { text: "・" + b })); });
    rc.appendChild(h("p", { class: "small", style: "margin:10px 0 0", text: "提案: 「おすすめ」の傾向で " + rec.n + " 問（目安: 約 " + Math.round(rec.n * 1.5) + " 分。1問1.5分で計算）。※ 記録をもとにした自動の提案です（ルールによる計算で、AIが文章を作っているわけではありません）。" }));
    rc.appendChild(h("div", { class: "row" }, [h("button", { text: "このおすすめで始める", onclick: function () {
      launch({ sets: null, dom: "", scope: "all", n: rec.n, mode: "smart", sq: true, so: true });
    } })]));
    box.appendChild(rc);

    // 条件を選んで解く
    var card = h("div", { class: "card" });
    card.appendChild(h("h2", { text: "条件を選んで解く" }));
    var checks = [];
    card.appendChild(h("h2", { style: "font-size:.95rem", text: "問題セット" }));
    SETS.forEach(function (set) {
      var cb = h("input", { type: "checkbox" });
      cb.checked = !prefs.sets || prefs.sets.indexOf(set.id) >= 0;
      cb.addEventListener("change", update);
      checks.push({ cb: cb, set: set });
      card.appendChild(h("label", { class: "check" }, [cb, h("span", { text: set.title + "（" + set.questions.length + "問）" })]));
    });

    card.appendChild(h("h2", { style: "font-size:.95rem", text: "分野" }));
    var domSel = h("select", { onchange: update }, [h("option", { value: "", text: "すべての分野" })].concat(DOMAINS.map(function (d) { return h("option", { value: d, text: domLabel(d) }); })));
    domSel.value = prefs.dom || "";
    card.appendChild(domSel);

    card.appendChild(h("h2", { style: "font-size:.95rem", text: "範囲" }));
    var scopes = [
      { v: "all", t: "すべて" },
      { v: "retry", t: "未回答、または前回まちがえた問題だけ" },
      { v: "ever", t: "過去に1度でもまちがえた問題だけ" }
    ];
    var scopeRadios = scopes.map(function (sc) {
      var r = h("input", { type: "radio", name: "scope", value: sc.v });
      r.checked = (prefs.scope || "all") === sc.v;
      r.addEventListener("change", update);
      card.appendChild(h("label", { class: "check" }, [r, h("span", { text: sc.t })]));
      return r;
    });

    card.appendChild(h("h2", { style: "font-size:.95rem", text: "問題数" }));
    var nSel = h("select", { onchange: update }, [5, 10, 15, 20, 30, 0].map(function (v) { return h("option", { value: String(v), text: v ? v + "問" : "すべて" }); }));
    nSel.value = String(prefs.n != null ? prefs.n : 10);
    card.appendChild(nSel);
    var timeNote = h("span", { class: "small", style: "margin-left:10px" });
    card.appendChild(timeNote);

    card.appendChild(h("h2", { style: "font-size:.95rem", text: "出題の傾向" }));
    var modeRadios = MODES.map(function (m) {
      var r = h("input", { type: "radio", name: "mode", value: m.v });
      r.checked = (prefs.mode || "smart") === m.v;
      r.addEventListener("change", update);
      card.appendChild(h("label", { class: "check", style: "margin-bottom:0" }, [r, h("span", { text: m.t })]));
      card.appendChild(h("div", { class: "small", style: "margin:0 0 6px 28px", text: m.d }));
      return r;
    });

    // タイマーの設定（保存できます）
    var tm = loadTimer();
    card.appendChild(h("h2", { style: "font-size:.95rem", text: "タイマー（目標時間）" }));
    var tOn = h("input", { type: "checkbox" }); tOn.checked = tm.on;
    card.appendChild(h("label", { class: "check" }, [tOn, h("span", { text: "タイマーを使う（目標を過ぎても止まりません。残り時間がゲージで出ます）" })]));
    var tAns = h("input", { type: "number", min: "5", max: "1800", step: "10" }); tAns.value = String(tm.ans);
    var tRev = h("input", { type: "number", min: "5", max: "1800", step: "10" }); tRev.value = String(tm.rev);
    card.appendChild(h("div", { class: "check" }, [h("span", { text: "回答の目標（1問あたり）" }), tAns, h("span", { text: "秒" })]));
    card.appendChild(h("div", { class: "check" }, [h("span", { text: "解説を読む目標（1問あたり）" }), tRev, h("span", { text: "秒" })]));
    var presets = [
      { t: "標準（初期値）", a: TIMER_DEFAULT.ans, r: TIMER_DEFAULT.rev },
      { t: "本番と同じペース", a: 120, r: 60 },
      { t: "きびしめ", a: 60, r: 90 }
    ];
    var prow = h("div", { class: "row", style: "margin:4px 0" }, [h("span", { class: "small", text: "かんたん設定:" })]);
    presets.forEach(function (p) {
      prow.appendChild(h("button", { class: "ghost small", text: p.t, onclick: function () { tAns.value = String(p.a); tRev.value = String(p.r); update(); } }));
    });
    card.appendChild(prow);
    var tNote = h("p", { class: "small", style: "margin:4px 0" });
    card.appendChild(tNote);
    var tSaved = h("span", { class: "small" });
    card.appendChild(h("div", { class: "row", style: "margin:4px 0 8px" }, [
      h("button", { class: "ghost small", text: "タイマー設定を保存", onclick: function () {
        save(K_TIMER, readTimer());
        tSaved.textContent = "保存しました（次に始める回から使われます）";
      } }),
      h("button", { class: "ghost small", text: "初期値に戻す", onclick: function () {
        tOn.checked = TIMER_DEFAULT.on; tAns.value = String(TIMER_DEFAULT.ans); tRev.value = String(TIMER_DEFAULT.rev);
        save(K_TIMER, readTimer()); update(); tSaved.textContent = "初期値に戻して保存しました";
      } }),
      tSaved
    ]));
    card.appendChild(h("p", { class: "small", text: "目安: 本番は60問で120分（1問あたり2分）です。解説を読む時間は、本番にはないので、練習用の目標です。「はじめる」を押すと、この設定も保存されます。" }));
    function readTimer() { return { on: tOn.checked, ans: clampSec(tAns.value, TIMER_DEFAULT.ans), rev: clampSec(tRev.value, TIMER_DEFAULT.rev) }; }
    [tOn, tAns, tRev].forEach(function (el) { el.addEventListener("input", function () { tSaved.textContent = ""; update(); }); });

    card.appendChild(h("h2", { style: "font-size:.95rem", text: "オプション" }));
    var shQ = h("input", { type: "checkbox" }); shQ.checked = prefs.sq !== false;
    var shO = h("input", { type: "checkbox" }); shO.checked = prefs.so !== false;
    card.appendChild(h("label", { class: "check" }, [shQ, h("span", { text: "問題の順番をシャッフルする" })]));
    card.appendChild(h("label", { class: "check" }, [shO, h("span", { text: "選択肢の順番をシャッフルする" })]));
    card.appendChild(h("p", { class: "small", text: "途中でしんどくなったら、問題画面の「中断して保存」を押せます。そこまでの結果は記録され、あとで続きから再開できます。" }));

    var summary = h("p", { class: "small", style: "font-weight:700" });
    card.appendChild(summary);

    function collect() {
      return {
        sets: checks.filter(function (x) { return x.cb.checked; }).map(function (x) { return x.set.id; }),
        dom: domSel.value,
        scope: scopeRadios.filter(function (r) { return r.checked; })[0].value,
        n: parseInt(nSel.value, 10),
        mode: modeRadios.filter(function (r) { return r.checked; })[0].value,
        sq: shQ.checked, so: shO.checked

    }
    function update() {
      var o = collect();
      var pool = poolFor(o);
      var n = !o.n ? pool.length : Math.min(o.n, pool.length);
      summary.textContent = "対象 " + pool.length + " 問から " + n + " 問を選びます（傾向: " + modeLabel(o.mode) + "）。";
      timeNote.textContent = "目安: 約 " + Math.round(n * 1.5) + " 分";
      var tv = readTimer();
      tNote.textContent = tv.on
        ? n + " 問なら: 回答 " + fmtMin(tv.ans * n) + " ＋ 解説 " + fmtMin(tv.rev * n) + "（合計 " + fmtMin((tv.ans + tv.rev) * n) + "）"
        : "タイマーは使いません。";
    }
    shQ.addEventListener("change", update); shO.addEventListener("change", update);
    update();

    card.appendChild(h("div", { class: "row" }, [h("button", { text: "はじめる", onclick: function () {
      var o = collect();
      save(K_PREFS, o);
      save(K_TIMER, readTimer());
      launch(o);
    } })]));
    box.appendChild(card);
    if (!SETS.length) box.appendChild(h("div", { class: "banner", text: "問題データが読み込めませんでした。data フォルダのファイルを確認してください。" }));
    return box;
  }

  function beginRun(qs, shuffleQ, shuffleO, reasons, label) {
    var list = shuffleQ ? shuffle(qs) : qs.slice().sort(function (a, b) { return ALLQ.indexOf(a) - ALLQ.indexOf(b); });
    var optOrder = {};
    list.forEach(function (q) { optOrder[q.id] = (shuffleO ? shuffle(q.options) : q.options).map(function (o) { return o.id; }); });
    var tm = loadTimer();   // この回のタイマー設定は、開始時の値で固定します（途中で再開しても同じ）
    run = { id: Date.now(), order: list.map(function (q) { return q.id; }), optOrder: optOrder, results: [], reasons: reasons || {}, mode: label || "",
      timer: tm.on ? { on: true, ans: tm.ans, rev: tm.rev } : { on: false }, t: { a: 0, r: 0 }, cur: null };
    save(K_RUN, run);
    renderQuestion();
  }
  // 再挑戦（選んだ問題を、そのまま出す）
  function startRun(questions, shuffleQ, shuffleO) { beginRun(questions, shuffleQ, shuffleO, {}, "再挑戦"); }

  /* ---------- 出題画面 ---------- */
  function renderQuestion() {
    clear();
    var idx = run.results.length;
    if (idx >= run.order.length) { finishRun(); return; }
    var q = QMAP[run.order[idx]];
    var opts = run.optOrder[q.id].map(function (id) { return optById(q, id); });
    var isMulti = q.type === "multi";
    var need = isMulti ? q.pick : 1;
    var answered = false;

    app.appendChild(h("div", { class: "topbar" }, [
      h("span", { class: "small", text: "全 " + run.order.length + " 問中 " + (idx + 1) + " 問目" }),
      h("button", { class: "ghost small", text: "中断して保存", onclick: interrupt })
    ]));
    app.appendChild(h("div", { class: "progress" }, [h("div", { style: "width:" + (idx / run.order.length * 100) + "%" })]));

    var ui = null;
    if (timerOn(run)) {
      if (!run.cur || run.cur.i !== idx) run.cur = { i: idx, a: 0 };
      phase = "ans"; paused = false;
      ui = timerPanel();
      app.appendChild(ui.el);
    }

    var card = h("div", { class: "card" });
    var tg = h("div", { class: "tags" }, [
      h("span", { class: "tag", text: q.domain }),
      h("span", { class: "tag plain", text: q.id })
    ]);
    ((run.reasons && run.reasons[q.id]) || []).forEach(function (w) { tg.appendChild(h("span", { class: "badge warn", text: "選ばれた理由: " + w })); });
    card.appendChild(tg);
    card.appendChild(h("p", { class: "qtext", text: q.q }));
    if (isMulti) card.appendChild(h("p", { class: "hint", text: "※ " + need + "つ選んでください。" }));

    var inputs = [];
    opts.forEach(function (o) {
      var input = h("input", { type: isMulti ? "checkbox" : "radio", name: "opt", value: o.id });
      var label = h("label", { class: "opt" }, [input, h("span", { text: o.t })]);
      input.addEventListener("change", update);
      label.addEventListener("click", function () { if (ui) ui.resume(); });   // 選択肢を押したら、一時停止を解除
      inputs.push({ input: input, label: label, o: o });
      card.appendChild(label);
    });
    var submit = h("button", { class: "primary", text: "回答する", disabled: "disabled" });
    var isLast = idx + 1 >= run.order.length;
    var next = h("button", { class: "primary", text: (isLast ? "結果を見る" : "次の問題へ") + " ▶", style: "display:none" });
    card.appendChild(h("div", { class: "row" }, [submit, next]));
    var feedback = h("div");
    card.appendChild(feedback);
    app.appendChild(card);

    function selected() { return inputs.filter(function (x) { return x.input.checked; }).map(function (x) { return x.o.id; }); }
    function update() { if (!answered) submit.disabled = selected().length !== need; }

    submit.addEventListener("click", function () {
      if (answered) return;
      answered = true;
      if (ui) ui.resume();
      var sel = selected(), ans = q.answer;
      var ok = sel.length === ans.length && sel.every(function (s) { return ans.indexOf(s) >= 0; });
      if (ui) { flushTick(); phase = "rev"; }   // ここまでが「回答の時間」。以降は「解説を読む時間」
      run.results.push({ qid: q.id, ok: ok, sel: sel, ta: run.cur ? run.cur.a : null, tr: 0 });
      recordAnswer(q.id, ok);
      save(K_RUN, run);
      upsertHistory(run, run.results.length >= run.order.length ? "complete" : "interrupted");
      inputs.forEach(function (x) {
        x.input.disabled = true; x.label.classList.add("locked");
        var isAns = ans.indexOf(x.o.id) >= 0, isSel = sel.indexOf(x.o.id) >= 0;
        if (isAns) { x.label.classList.add("correct"); x.label.appendChild(h("span", { class: "mark ok", text: "正解" })); }
        else if (isSel) { x.label.classList.add("wrong"); x.label.appendChild(h("span", { class: "mark ng", text: "不正解" })); }
      });
      feedback.appendChild(h("p", { class: "verdict " + (ok ? "ok" : "ng"), text: ok ? "正解です" : "不正解です" }));
      feedback.appendChild(explainBlock(q));
      if (q.basics) feedback.appendChild(basicsBlock(q));
      submit.style.display = "none";
      next.style.display = "";
      if (ui) ui.update();
    });
    next.addEventListener("click", function () { renderQuestion(); });
    if (ui) startTick(ui);
  }

  function interrupt() {
    flushTick();
    if (!run.results.length) { remove(K_RUN); run = null; go("solve"); return; }
    upsertHistory(run, "interrupted");
    save(K_RUN, run);
    renderResult(run, false);
  }
  function finishRun() {
    upsertHistory(run, "complete");
    remove(K_RUN);
    renderResult(run, true);
  }

  /* ---------- 結果画面 ---------- */
  function domainTable(results) {
    var by = {};
    results.forEach(function (r) {
      var k = QMAP[r.qid].domain;
      by[k] = by[k] || { c: 0, t: 0 };
      by[k].t++; if (r.ok) by[k].c++;
    });
    var t = h("table");
    t.appendChild(h("tr", null, [h("th", { text: "分野" }), h("th", { text: "" }), h("th", { class: "num", text: "正解" }), h("th", { class: "num", text: "正答率" })]));
    Object.keys(by).forEach(function (k) {
      var v = by[k];
      t.appendChild(h("tr", null, [
        h("td", { text: domLabel(k) }),
        h("td", null, [h("div", { class: "bar" }, [h("div", { style: "width:" + pct(v.c, v.t) + "%" })])]),
        h("td", { class: "num", text: v.c + " / " + v.t }),
        h("td", { class: "num", text: pct(v.c, v.t) + "%" })
      ]));
    });
    return t;
  }
  function resultView(results, total, titleText, noteText, extraButtons, backGo, timeEl) {
    clear();
    var correct = results.filter(function (r) { return r.ok; }).length;
    app.appendChild(h("h1", { text: titleText }));
    var head = h("div", { class: "card" });
    head.appendChild(h("div", { class: "result-head", text: correct + " / " + results.length + " 問正解（" + pct(correct, results.length) + "%）" }));
    if (noteText) head.appendChild(h("div", { class: "notice", style: "margin-top:10px", text: noteText }));
    head.appendChild(h("div", { class: "small", text: "複数選択の問題は、選んだものがすべて合っているときだけ正解として数えています。" }));
    app.appendChild(head);
    if (timeEl) app.appendChild(timeEl);
    if (results.length) {
      var dc = h("div", { class: "card" });
      dc.appendChild(h("h2", { text: "分野ごとの正答率（回答した問題のみ）" }));
      dc.appendChild(domainTable(results));
      app.appendChild(dc);
    }
    var misses = results.filter(function (r) { return !r.ok; });
    var mc = h("div", { class: "card" });
    mc.appendChild(h("h2", { text: "まちがえた問題（" + misses.length + "問）" }));
    if (!misses.length) mc.appendChild(h("p", { text: "まちがえた問題はありません。" }));
    app.appendChild(mc);
    misses.forEach(function (r) { app.appendChild(questionBlock(QMAP[r.qid], { sel: r.sel, ok: false })); });
    var row = h("div", { class: "row" });
    (extraButtons || []).forEach(function (b) { row.appendChild(b); });
    if (misses.length) row.appendChild(h("button", { class: "ghost", text: "まちがえた問題だけ再挑戦", onclick: function () {
      startRun(misses.map(function (r) { return QMAP[r.qid]; }), true, true);
    } }));
    row.appendChild(h("button", { class: "ghost", text: "ホームへ戻る", onclick: function () { go(backGo || "solve"); } }));
    app.appendChild(row);
  }
  function renderResult(r, finished) {
    var extra = [];
    var note = null;
    if (!finished) {
      note = "中断しました（全 " + r.order.length + " 問中 " + r.results.length + " 問まで回答）。ここまでの結果は記録されています。「解く」タブから、続きを再開できます。";
      extra.push(h("button", { text: "続きから再開", onclick: function () { renderQuestion(); } }));
    }
    resultView(r.results, r.order.length, finished ? "結果" : "中断して保存しました", note, extra, "solve", timeCard(r, finished));
  }

  /* ---------- 「問題一覧（見るだけ）」タブ ---------- */
  var bf = { domain: "", status: "", kw: "", open: false };
  function viewBrowse() {
    var box = h("div");
    var stats = load(K_QSTAT, {});
    function opt(v, t) { return h("option", { value: v, text: t }); }
    var selDomain = h("select", { onchange: refresh }, [opt("", "分野: すべて")].concat(DOMAINS.map(function (d) { return opt(d, domLabel(d)); })));
    selDomain.value = bf.domain;
    var selStatus = h("select", { onchange: refresh }, [
      opt("", "状態: すべて"), opt("none", "未回答"), opt("ok", "前回 正解"), opt("ng", "前回 不正解"), opt("ever", "過去に1度でも不正解")
    ]);
    selStatus.value = bf.status;
    var kw = h("input", { type: "text", placeholder: "キーワードで探す", oninput: refresh });
    kw.value = bf.kw;
    var openAll = h("input", { type: "checkbox", onchange: refresh });
    openAll.checked = bf.open;
    box.appendChild(h("div", { class: "controls" }, [
      selDomain, selStatus, kw, h("label", { class: "check" }, [openAll, h("span", { text: "答えと解説をすべて開く" })])
    ]));
    var count = h("div", { class: "small", style: "margin-bottom:8px" });
    var list = h("div");
    box.appendChild(count);
    box.appendChild(list);

    function refresh() {
      bf.domain = selDomain.value; bf.status = selStatus.value; bf.kw = kw.value; bf.open = openAll.checked;
      while (list.firstChild) list.removeChild(list.firstChild);
      var key = bf.kw.trim().toLowerCase();
      var shown = ALLQ.filter(function (q) {
        var s = stats[q.id];
        if (bf.domain && q.domain !== bf.domain) return false;
        if (bf.status === "none" && s) return false;
        if (bf.status === "ok" && !(s && s.last === true)) return false;
        if (bf.status === "ng" && !(s && s.last === false)) return false;
        if (bf.status === "ever" && !(s && s.n > s.c)) return false;
        if (key) {
          var hay = (q.q + " " + q.options.map(function (o) { return o.t; }).join(" ") + " " + q.explain + " " + (q.basics || "")).toLowerCase();
          if (hay.indexOf(key) < 0) return false;
        }
        return true;
      });
      count.textContent = shown.length + " / " + ALLQ.length + " 問を表示中（回答は記録されません）";
      shown.forEach(function (q) { list.appendChild(questionBlock(q, { open: bf.open, stat: stats[q.id] })); });
      if (!shown.length) list.appendChild(h("div", { class: "card", text: "該当する問題がありません。" }));
    }
    refresh();
    return box;
  }

  /* ---------- 「履歴」タブ ---------- */
  function viewHistory() {
    var box = h("div");
    var list = load(K_HIST, []);
    var run0 = load(K_RUN, null);
    var card = h("div", { class: "card" });
    card.appendChild(h("h2", { text: "これまでの回答（新しい順）" }));
    if (!list.length) { card.appendChild(h("p", { text: "まだ履歴がありません。「解く」タブから始めてください。" })); box.appendChild(card); return box; }
    var t = h("table");
    t.appendChild(h("tr", null, [h("th", { text: "日時" }), h("th", { text: "状態" }), h("th", { text: "出題" }), h("th", { class: "num", text: "回答 / 全体" }), h("th", { class: "num", text: "正解" }), h("th", { class: "num", text: "正答率" }), h("th", { text: "" })]));
    list.forEach(function (e) {
      var answered = e.answered != null ? e.answered : e.total;
      var interrupted = e.status === "interrupted";
      t.appendChild(h("tr", null, [
        h("td", { text: e.at }),
        h("td", null, [h("span", { class: "badge " + (interrupted ? "warn" : "ok"), text: interrupted ? "中断" : "完了" })]),
        h("td", { class: "small", text: e.mode || "" }),
        h("td", { class: "num", text: answered + " / " + e.total }),
        h("td", { class: "num", text: e.correct + " / " + answered }),
        h("td", { class: "num", text: pct(e.correct, answered) + "%" }),
        h("td", null, [h("button", { class: "ghost small", text: "詳細", onclick: function () { historyDetail(e, run0); } })])
      ]));
    });
    card.appendChild(t);
    card.appendChild(h("p", { class: "small", text: "このブラウザに保存されています（最大50回分）。別のブラウザやパソコンには引き継がれません。" }));
    box.appendChild(card);
    return box;
  }
  function historyDetail(e, run0) {
    var content = h("div");
    var answered = e.answered != null ? e.answered : e.total;
    var interrupted = e.status === "interrupted";
    var head = h("div", { class: "card" }, [
      h("h2", { text: e.at + " の回" }),
      h("p", { text: (interrupted ? "中断（" : "完了（") + answered + " / " + e.total + " 問回答）　正解 " + e.correct + " 問（" + pct(e.correct, answered) + "%）" })
    ]);
    if (e.time) {
      var cnt = interrupted ? Math.max(1, answered) : e.total;
      head.appendChild(h("p", { class: "small", text: "時間: 回答 " + fmtSec(e.time.a) + "（目標 " + fmtSec(e.time.ta * cnt) + "）／ 解説 " + fmtSec(e.time.r) + "（目標 " + fmtSec(e.time.tr * cnt) + "）" }));
    }
    var row = h("div", { class: "row" });
    row.appendChild(h("button", { class: "ghost", text: "← 履歴に戻る", onclick: function () { go("history"); } }));
    if (interrupted && validRun(run0) && run0.id === e.id && run0.results.length < run0.order.length) {
      row.appendChild(h("button", { text: "この回を続きから再開", onclick: function () { run = run0; renderQuestion(); } }));
    }
    var misses = (e.details || []).filter(function (d) { return !d.ok && QMAP[d.q]; });
    if (misses.length) row.appendChild(h("button", { class: "ghost", text: "この回でまちがえた問題だけ再挑戦", onclick: function () {
      startRun(misses.map(function (d) { return QMAP[d.q]; }), true, true);
    } }));
    head.appendChild(row);
    content.appendChild(head);
    if (!e.details) {
      content.appendChild(h("div", { class: "card", text: "この回は、問題ごとの記録がない旧形式です（点数のみ）。" }));
    } else {
      e.details.forEach(function (d) {
        if (QMAP[d.q]) content.appendChild(questionBlock(QMAP[d.q], { sel: d.sel, ok: d.ok }));
      });
    }
    shell("history", content);
  }

  /* ---------- 「問題別成績」タブ ---------- */
  var sortMode = "order";
  function viewStats() {
    var box = h("div");
    var stats = load(K_QSTAT, {});
    var dcard = h("div", { class: "card" });
    dcard.appendChild(h("h2", { text: "分野ごとの成績（これまでの累計）" }));
    var dt = h("table");
    dt.appendChild(h("tr", null, [h("th", { text: "分野" }), h("th", { class: "num", text: "問題数" }), h("th", { class: "num", text: "回答済み" }), h("th", { class: "num", text: "前回正解" }), h("th", { class: "num", text: "累計正答率" })]));
    DOMAINS.forEach(function (d) {
      var qs = ALLQ.filter(function (q) { return q.domain === d; });
      var seen = 0, lastOk = 0, sn = 0, sc = 0;
      qs.forEach(function (q) { var s = stats[q.id]; if (s) { seen++; if (s.last) lastOk++; sn += s.n; sc += s.c; } });
      dt.appendChild(h("tr", null, [
        h("td", { text: domLabel(d) }),
        h("td", { class: "num", text: String(qs.length) }),
        h("td", { class: "num", text: seen + " / " + qs.length }),
        h("td", { class: "num", text: lastOk + " / " + qs.length }),
        h("td", { class: "num", text: sn ? pct(sc, sn) + "%" : "—" })
      ]));
    });
    dcard.appendChild(dt);
    dcard.appendChild(h("p", { class: "small", text: "「前回正解」は、各問題の直近の回答が正解だった問題の数です。配点は、公式の試験ガイドにもとづく目安です。" }));
    box.appendChild(dcard);
    var card = h("div", { class: "card" });
    card.appendChild(h("h2", { text: "問題ごとの成績" }));
    var sorts = [{ v: "order", t: "出題順" }, { v: "rate", t: "正答率が低い順" }, { v: "wrong", t: "まちがえた回数が多い順" }];
    var ctl = h("div", { class: "controls" });
    sorts.forEach(function (s) {
      ctl.appendChild(h("button", { class: "tab small" + (sortMode === s.v ? " active" : ""), text: s.t, onclick: function () { sortMode = s.v; go("stats"); } }));
    });
    card.appendChild(ctl);
    var items = ALLQ.slice();
    function rate(q) { var s = stats[q.id]; return s ? s.c / s.n : 2; }
    function wrong(q) { var s = stats[q.id]; return s ? s.n - s.c : -1; }
    if (sortMode === "rate") items.sort(function (a, b) { return rate(a) - rate(b); });
    if (sortMode === "wrong") items.sort(function (a, b) { return wrong(b) - wrong(a); });
    var t = h("table");
    t.appendChild(h("tr", null, [h("th", { text: "問題" }), h("th", { class: "num", text: "挑戦" }), h("th", { class: "num", text: "正解" }), h("th", { class: "num", text: "正答率" }), h("th", { text: "前回" })]));
    items.forEach(function (q) {
      var s = stats[q.id];
      var short = q.q.length > 44 ? q.q.slice(0, 44) + "…" : q.q;
      t.appendChild(h("tr", { class: "click", onclick: function () { questionDetail(q); } }, [
        h("td", null, [h("div", { text: short }), h("div", { class: "small", text: q.id + " ／ " + q.domain })]),
        h("td", { class: "num", text: s ? String(s.n) : "—" }),
        h("td", { class: "num", text: s ? String(s.c) : "—" }),
        h("td", { class: "num", text: s ? pct(s.c, s.n) + "%" : "—" }),
        h("td", { text: s ? (s.last ? "○" : "×") : "未" })
      ]));
    });
    card.appendChild(t);
    card.appendChild(h("p", { class: "small", text: "行をクリックすると、その問題の詳しい履歴と解説が見られます。" }));
    box.appendChild(card);
    return box;
  }
  function questionDetail(q) {
    var stats = load(K_QSTAT, {});
    var s = stats[q.id];
    var content = h("div");
    content.appendChild(h("div", { class: "row", style: "margin:0 0 12px" }, [h("button", { class: "ghost", text: "← 問題別成績に戻る", onclick: function () { go("stats"); } })]));
    content.appendChild(questionBlock(q, { open: true, stat: s }));
    var hc = h("div", { class: "card" }, [h("h2", { text: "この問題の回答履歴（古い順）" })]);
    if (!s) hc.appendChild(h("p", { text: "まだ回答していません。" }));
    else {
      var tl = h("div", { class: "timeline" });
      s.hist.forEach(function (x) { tl.appendChild(h("span", { class: "badge " + (x.ok ? "ok" : "ng"), text: fmt(x.ts) + " " + (x.ok ? "○" : "×") })); });
      hc.appendChild(tl);
    }
    content.appendChild(hc);
    shell("stats", content);
  }

  go("solve");
})();
</script>
</body>
</html>
